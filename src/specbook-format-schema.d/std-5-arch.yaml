-   kind: ARCH
    name: Architecture Tenets
    id: AT
    file: 22-ARCH-AT-Architecture-Tenets.md
    desc: >
        The architecture philosophy of the solution, stated as the few overarching maxims and the
        standing principles derived from them, which every pattern, view, tactic, decision, and
        aspect of the architecture has to obey, while the reusable structures belong to the
        Architecture Patterns and the concrete ones to the views following them. The maxims are listed in decreasing precedence, so that whenever two maxims conflict
        in a particular design decision, the earlier one wins, and a principle conflict is settled
        by the precedence of the maxims the principles derive from.

        The tenets are prescriptive and reusable, not verifiable and not decided once: a quality
        bound verifiable by a metric is a Non-Functional Requirement, the mechanism achieving a
        quality is a Quality Perspectives tactic, the rule about the source structure and process
        is a Development Aspects aspect, the one-off trade-off between genuine alternatives is a
        Design Decisions decision (which applies the tenets through `GUIDED-BY`), and the
        principle governing the user's experience is an Interaction Concept principle.
    optional: true
    refs: >
        -   The Open Group: TOGAF Standard, 10th ed.: Architecture Principles (2022),
            https://pubs.opengroup.org/togaf-standard/adm-techniques/chap02.html
        -   Greefhorst/Proper: Architecture Principles: The Cornerstones of Enterprise Architecture (2011),
            https://link.springer.com/book/10.1007/978-3-642-20279-7
        -   Starke/Hruschka: arc42 Template: Solution Strategy (2005),
            https://arc42.org/overview
    diagram:
        type: grid
        nodes: "[[MAXIM:*]], [[AT.PRINCIPLE:*]]"
        config:
            size-node-width-max: 440
            grid-columns-max: 4
    children:
        -   kind: MAXIM
            desc: >
                A single architecture maxim, named with a short (2-5 word) preference or imperative
                (e.g. `Simplicity over Flexibility`, `Buy before Build`, `Own the Data`) and
                described in a concise (1-3 sentence) paragraph by how it guides the architecture
                of the solution as a whole, plus a 1-sentence rationale ("why"). A solution has only
                a few (3-7) maxims: a maxim is solution-wide and independent of any particular view
                or element (a rule bound to a structure is a principle instead), decides between
                design alternatives (the subordinated side usually named by its `X over Y` form),
                and is not verifiable by a metric (a measurable quality bound is a Non-Functional
                Requirement instead).
            optional: true
            format:
                type: compact
            diagram:
                type: hub
                center: self
                nodes: "[[MAXIM:*]], [[AT.PRINCIPLE:*]], [[NR.REQUIREMENT:*]], [[PREMISE:*]],
                    [[TACTIC:*]], [[DECISION:*]], [[ASPECT:*]]"
                labeled: true
                qualified: true
                config:
                    size-node-width-max: 440
            props:
                -   name: DRIVEN-BY
                    desc: >
                        Comma-separated references to the NON-FUNCTIONAL-REQUIREMENTS or
                        SOLUTION-PREMISES objects the maxim answers (e.g. the maintainability
                        requirement, the small-team premise), so that a maxim is grounded in the
                        forces on the solution rather than in taste alone; omitted for a maxim
                        rooted in the Solution Vision alone.
                    value: list([[NR.*]], [[PREMISE:*]])
                    optional: true
        -   kind: PRINCIPLE
            desc: >
                A single architecture principle, named with a short (2-5 word) summary (e.g.
                `Stateless Services`, `One Owner per Entity`, `Async between Contexts`) and
                described in a concise (1-3 sentence) paragraph as the standing rule the
                architecture follows whenever its concern arises, stated with `MUST`/`MUST NOT`
                or `SHOULD`/`SHOULD NOT`, plus a 1-sentence rationale ("why"). A principle is
                bound to a particular structure of the architecture (a rule independent of any
                structure is a maxim instead), reusable across many decisions (a trade-off made
                once between genuine alternatives is a Design Decisions decision instead), names
                no mechanism and no product (the mechanism is a Quality
                Perspectives tactic, the product a Technology Stack component), and governs the
                architecture, not the source process (a Development Aspects aspect), the code (a
                Code Patterns pattern), or the user's experience (an Interaction Concept
                principle).
            optional: true
            format:
                type: compact
            diagram:
                type: hub
                center: self
                nodes: "[[MAXIM:*]], [[AT.PRINCIPLE:*]], [[NR.REQUIREMENT:*]], [[PREMISE:*]],
                    [[TACTIC:*]], [[DECISION:*]], [[ASPECT:*]]"
                labeled: true
                qualified: true
                config:
                    size-node-width-max: 440
            props:
                -   name: MAXIMS
                    desc: >
                        Comma-separated references to the MAXIM objects the principle
                        concretizes (e.g. a `Stateless Services` principle concretizing a
                        `Scale Out over Scale Up` maxim), so that the principles form a hierarchy
                        below the maxims rather than a flat catalogue; omitted for a principle
                        standing on its own forces alone.
                    value: list([[MAXIM:*]])
                    optional: true
                -   name: DRIVEN-BY
                    desc: >
                        Comma-separated references to the NON-FUNCTIONAL-REQUIREMENTS or
                        SOLUTION-PREMISES objects the principle answers beyond the maxims it
                        concretizes (e.g. the availability requirement, the hosting constraint);
                        omitted for a principle grounded in its maxims alone.
                    value: list([[NR.*]], [[PREMISE:*]])
                    optional: true
                -   name: IMPLICATIONS
                    desc: >
                        What following the principle obliges the architecture to, stated as a 1-2
                        sentence description of the consequences for the elements it governs
                        (e.g. `session state lives in the shared store, so every component
                        instance is replaceable at any time`), as opposed to the rationale which
                        states why the principle is worth these consequences; omitted when nothing
                        non-obvious follows from the principle.
                    optional: true

-   kind: ARCH
    name: Architecture Patterns
    id: AP
    file: 23-ARCH-AP-Architecture-Patterns.md
    desc: >
        The reusable structural solutions the architecture of the solution follows, each a named
        pattern of the literature or of the organization (e.g. hexagonal architecture,
        transactional outbox, backend for frontend) applied to the solution as a whole, which the
        views following them realize, the tactics build upon, the decisions choose, and the code
        patterns code. The artifact completes the guidance of the architecture: the Architecture
        Tenets state what the architecture values and obeys, the patterns state the structures it
        takes to do so.

        A pattern names a structure, nothing else: the mechanism achieving one quality attribute
        is a Quality Perspectives tactic (which may be built from patterns), the one-off trade-off
        choosing a pattern over its alternatives is a Design Decisions decision, the coded form of
        a pattern is a Code Patterns pattern shown as a listing, and a structure of the user
        interface is a Dialog Patterns pattern.
    optional: true
    refs: >
        -   Buschmann et al.: Pattern-Oriented Software Architecture, Vol. 1: A System of Patterns (1996),
            https://www.wiley.com/en-us/Pattern+Oriented+Software+Architecture%2C+Volume+1%2C+A+System+of+Patterns-p-9780471958697
        -   Fowler: Patterns of Enterprise Application Architecture (2002),
            https://martinfowler.com/books/eaa.html
        -   Hohpe/Woolf: Enterprise Integration Patterns (2003),
            https://www.enterpriseintegrationpatterns.com/
        -   Richardson: Microservices Patterns (2018),
            https://microservices.io/patterns/
    diagram:
        type: grid
        nodes: "[[PATTERN:*]]"
        config:
            size-node-width-max: 440
            grid-columns-max: 4
    children:
        -   kind: PATTERN
            desc: >
                A single architecture pattern, named with its established short (2-5 word) name
                (e.g. `Hexagonal Architecture`, `Transactional Outbox`, `Backend for Frontend`)
                and described in a concise (1-3 sentence) paragraph by the structure the pattern
                prescribes and the problem it solves in the solution, plus a 1-sentence rationale
                ("why") for adopting it. A pattern is a structure reusable beyond one quality
                attribute (a mechanism for one quality is a Quality Perspectives tactic instead)
                and beyond one decision (a trade-off made once is a Design Decisions decision
                instead), applies the Architecture Tenets rather than restating them, and is
                realized by the elements of the views following it, which reference it, so its
                hub diagram shows where it took effect.
            optional: true
            format:
                type: compact
            diagram:
                type: hub
                center: self
                nodes: "[[PATTERN:*]], [[AT.PRINCIPLE:*]], [[NR.REQUIREMENT:*]], [[PREMISE:*]],
                    [[FV.COMPONENT:*]], [[TACTIC:*]], [[DECISION:*]], [[CODE-PATTERN:*]]"
                labeled: true
                qualified: true
                config:
                    size-node-width-max: 440
            props:
                -   name: PRINCIPLES
                    desc: >
                        Comma-separated references to the ARCHITECTURE-TENETS principles the
                        pattern applies (e.g. a `Transactional Outbox` applying an `Async between
                        Contexts` principle), so that a pattern is adopted for a stated stance of
                        the architecture rather than for its popularity; omitted for a pattern
                        applying no modeled principle.
                    value: list([[AT.PRINCIPLE:*]])
                    optional: true
                -   name: DRIVEN-BY
                    desc: >
                        Comma-separated references to the NON-FUNCTIONAL-REQUIREMENTS or
                        SOLUTION-PREMISES objects the pattern answers beyond the principles it
                        applies (e.g. the scalability requirement, the hosting constraint); omitted
                        for a pattern grounded in its principles alone.
                    value: list([[NR.*]], [[PREMISE:*]])
                    optional: true
                -   name: USES
                    desc: >
                        Comma-separated references to the smaller ARCHITECTURE-PATTERNS objects
                        the pattern is composed of (e.g. a `Saga` using a `Transactional Outbox`
                        for its steps), so that the patterns form a language of related structures
                        rather than a flat catalogue.
                    value: list([[PATTERN:*]])
                    optional: true
                    acyclic: true

-   kind: ARCH
    name: Context View
    id: CV
    file: 24-ARCH-CV-Context-View.md
    desc: >
        The relationships, dependencies, and interactions between the solution and its environment,
        defining the system's boundary by enumerating the external entities sitting at it. The
        artifact complements the Solution Vision: its `SCOPE` states what is deliberately *out* of
        the solution, the Context View enumerates what the solution touches *at* the boundary.
    optional: true
    refs: >
        -   Rozanski/Woods: Software Systems Architecture, 2nd ed.: The Context Viewpoint (2011),
            https://www.viewpoints-and-perspectives.info/home/viewpoints/context/
        -   Brown: The C4 Model: System Context Diagram (2018),
            https://c4model.com/diagrams/system-context
        -   ISO/IEC/IEEE 42010:2022: Software, systems and enterprise -- Architecture description (2022),
            https://www.iso.org/standard/74393.html
    diagram:
        type: hub
        nodes: "[[CV.ENTITY:*]]"
        center:
            source: "[[TI]]"
            property: TITLE
            kind: Solution
        centerEdges:
            property: DIRECTION
            inbound:  Inbound
            outbound: Outbound
            both:     Bidirectional
            via:      VIA
        qualified: true
        shapes:
            -   property: KIND
                value: Person
                shape: person
            -   property: KIND
                value: Service
                shape: cloud
            -   property: KIND
                value: Datastore
                shape: database
            -   property: KIND
                value: Device
                shape: device
        properties:
            -   KIND
    children:
        -   kind: ENTITY
            desc: >
                A single external entity the solution interacts with, named with a short (2-5 word)
                summary (e.g. `Payment Gateway`, `Identity Provider`, `End User`) and described in
                a concise (1-3 sentence) paragraph by the relationship and dependency between the
                solution and the entity, plus a 1-sentence rationale ("why") for the entity being
                part of the system context.

                An entity is outside the solution and exchanges information with it across the
                boundary: a party with a mere interest in the solution but no such exchange is a
                `Stakeholder` persona of the User Personas instead, and a platform element the
                solution deploys and operates itself (e.g. a managed database of its own) is a
                Deployment View node instead -- only a party or system the solution merely consumes
                or serves belongs to the system context.
            optional: true
            format:
                type: compact
                maxTableColumns: 5
            props:
                -   name: KIND
                    desc: |
                        The kind of the external entity, one of:
                        -   `Person`:       A human actor interacting with the solution.
                        -   `System`:       An external software system the solution integrates with.
                        -   `Service`:      A third-party or managed service the solution consumes.
                        -   `Datastore`:    An external data repository the solution reads from or writes to.
                        -   `Device`:       A physical device or sensor the solution communicates with.
                        -   `Organization`: An external organizational party.
                    value: enum(Person,System,Service,Datastore,Device,Organization)
                -   name: DIRECTION
                    desc: >
                        Who initiates the interaction: `Inbound` (the entity drives the solution),
                        `Outbound` (the solution drives the entity), or `Bidirectional` (both
                        sides initiate), independent of the direction the exchanged information
                        flows in, which the `DATA` property describes (e.g. a datastore the
                        solution reads from is `Outbound`, as the solution initiates, while the
                        data flows in). For a mediated entity (see `VIA`), where the mediator
                        initiates every interaction, the direction of the data flow instead.
                    value: enum(Inbound,Outbound,Bidirectional)
                -   name: VIA
                    desc: >
                        Reference to the entity mediating the exchange with this one, when the
                        solution and the entity have no direct technical interaction at all,
                        but a person or system in between carries the data (e.g. a manager
                        uploading the file exported by an external system), so the context
                        diagram marks the edge as `via` that entity instead of suggesting an
                        online integration; omitted for a directly interacting entity.
                    value: "[[CV.ENTITY:*]]"
                    optional: true
                    acyclic: true
                -   name: TERMS
                    desc: >
                        Comma-separated references to the GLOSSARY terms the entity appears as in
                        the domain (usually a term of type `Actor`, which covers an external system
                        as a party acting in the domain), anchoring every boundary entity in the
                        ubiquitous language.
                    value: list([[TERM:*]])
                    optional: true
                -   name: INTERFACE
                    desc: >
                        Comma-separated references to the INTERFACE-MODEL objects through which
                        the interaction happens, i.e. the interfaces the entity consumes (for a
                        `Provided` one) or offers (for a `Required` one); omitted when the
                        interaction happens through the user interface or outside any modeled
                        interface (e.g. a file exchange).
                    value: list([[INTERFACE:*]])
                    optional: true
                -   name: ACTORS
                    desc: >
                        Comma-separated references to the User Personas ROLE objects acting
                        behind the entity: a `Person` entity is the boundary-level class of the
                        `Person` roles acting through it, while a `System` entity may reference
                        the `System` role it plays, so the entity aggregates the roles instead of
                        re-stating them; omitted when no modeled role stands behind the entity.
                    value: list([[ROLE:*]])
                    optional: true
                -   name: USE-CASES
                    desc: >
                        Comma-separated references to the USE-CASES objects whose interaction
                        crosses the boundary at this entity (the use cases a `Person` entity
                        performs, or the ones exchanging data with a `System` or `Service`
                        entity), so the use case responsible for an entity is found without a
                        text search; omitted when no modeled use case touches the entity.
                    value: list([[USE-CASE:*]])
                    optional: true
                -   name: PREMISES
                    desc: >
                        Comma-separated references to the SOLUTION-PREMISES objects (usually of
                        type `Dependency`) resting on this entity: the entity describes the
                        structural interaction with the external party, the premise the reliance
                        on it and the consequence of its failure, so the risky context entities
                        are found by traversal.
                    value: list([[PREMISE:*]])
                    optional: true
                -   name: DATA
                    desc: >
                        The principal information exchanged across the boundary with this entity.

-   kind: ARCH
    name: Functionality View
    id: FV
    file: 25-ARCH-FV-Functionality-View.md
    desc: >
        The functional components of the solution, their responsibilities, interfaces, and primary
        interactions, describing *how* the solution's runtime elements are structured and which
        responsibility each owns, delivering the behaviors the Functional Requirements state.
    optional: true
    refs: >
        -   Rozanski/Woods: Software Systems Architecture, 2nd ed.: The Functional Viewpoint (2011),
            https://www.viewpoints-and-perspectives.info/home/viewpoints/functional/
        -   Kruchten: Architectural Blueprints -- The "4+1" View Model of Software Architecture (1995),
            https://ieeexplore.ieee.org/document/469759
        -   Brown: The C4 Model (2018),
            https://c4model.com/
    diagram:
        -   type: graph
            nodes: "[[FV.COMPONENT:*]]"
            labeled: true
            nest:
                properties:
                    -   PART-OF
            shapes:
                -   property: KIND
                    value: Datastore
                    shape: database
            edgeLabels:
                source: CONSUMES
                target: PROVIDES
                properties:
                    -   KIND
                    -   TRANSPORT
            properties:
                -   KIND
        -   type: layer
            nodes: "[[FV.COMPONENT:*]]"
            layers:
                objects: "[[FV.LAYER:*]]"
                via:
                    -   LAYER
                    -   PART-OF
            shapes:
                -   property: KIND
                    value: Datastore
                    shape: database
            edgeLabels:
                source: CONSUMES
                target: PROVIDES
                properties:
                    -   KIND
                    -   TRANSPORT
            properties:
                -   KIND
            config:
                layer-numbered: true
        -   type: matrix
            nodes: "[[FV.COMPONENT:*]]"
            linkProps:
                -   DEPENDS-ON
            onlyConnected: true
            qualified: true
    children:
        -   kind: LAYER
            desc: >
                A horizontal stratum of a layered architecture, named with a short (1-3 word)
                summary (e.g. `Presentation Layer`, `Domain Layer`, `Persistence Layer`) and
                described by a 1-sentence description of the level of abstraction its components
                share plus a 1-sentence rationale ("why") for the layer. The layers are ordered
                top-down in document order, and a component may depend on the components of its
                own and of the lower layers only, so the layer diagram of the Functionality View
                marks every dependency pointing upwards; a layer is a separate kind instead of a
                component, BECAUSE a layer groups components without owning a responsibility
                itself and hence neither realizes, provides, nor is implemented by anything.
            optional: true
            mixins:
                -   EVIDENCE
            format:
                type: compact
                maxTableColumns: 5
            props:
                -   name: PART-OF
                    desc: >
                        Reference to the FUNCTIONALITY-VIEW layer this layer is a sub-layer of,
                        the outer layer then acting as a group of layers (e.g. the `Server Layers`
                        grouping the layers running in the data center); omitted for a top-level
                        layer.
                    value: "[[FV.LAYER:*]]"
                    optional: true
                    acyclic: true
        -   kind: COMPONENT
            desc: >
                A single functional component, named with a short (2-5 word) summary (e.g.
                `Authentication Service`, `Order Processor`, `Notification Dispatcher`) and
                described in a concise (1-3 sentence) paragraph whose first sentence names the
                single, primary responsibility the component owns (split into several components
                otherwise) and which elaborates how the component fulfills it and collaborates
                with the components it depends on, plus a 1-sentence rationale ("why") for the
                component's existence and boundary.
            optional: true
            mixins:
                -   EVIDENCE
            format:
                type: compact
                maxTableColumns: 5
            diagram:
                type: hub
                center: self
                nodes: "[[FV.LAYER:*]], [[FV.COMPONENT:*]], [[FR.REQUIREMENT:*]], [[PATTERN:*]], [[INTERFACE:*]],
                    [[DM.ENTITY:*]], [[UNIT:*]], [[STRUCTURE:*]], [[ALGORITHM:*]], [[PIPELINE:*]],
                    [[NODE:*]], [[CONCERN:*]], [[TACTIC:*]], [[DECISION:*]], [[CODE-PATTERN:*]],
                    [[SYMBOL:*]]"
                labeled: true
                qualified: true
                properties:
                    -   KIND
                config:
                    size-node-width-max:    440
                    size-node-height-scale: 1.75
                    hub-node-count-max:     3
            props:
                -   name: KIND
                    desc: |
                        The kind of the functional component, one of:
                        -   `Component`: Cohesive unit of functionality with a defined interface.
                        -   `Service`:   Provider of functionality with an independent lifecycle.
                        -   `Module`:    Logical grouping of related functionality within a
                                         component.
                        -   `Connector`: Mediator that conveys interactions between components
                                         (e.g. bus, gateway).
                        -   `Subsystem`: Larger composite grouping several components.
                        -   `Datastore`: Component holding the persistent data of the solution
                                         (e.g. a database, a file store), drawn as a cylinder.
                    value: enum(Component,Service,Module,Connector,Subsystem,Datastore)
                -   name: PART-OF
                    desc: >
                        Reference to the FUNCTIONALITY-VIEW object this component is contained
                        in, expressing the composition hierarchy the kinds imply: a `Module`
                        references the component it groups functionality within, and a
                        component references the `Subsystem` it belongs to; omitted for a
                        top-level component.
                    value: "[[FV.COMPONENT:*]]"
                    optional: true
                    acyclic: true
                -   name: LAYER
                    desc: >
                        Reference to the FUNCTIONALITY-VIEW layer the component resides in;
                        omitted for a component inheriting the layer of the component it is
                        `PART-OF`, or for a solution without a layered architecture.
                    value: "[[FV.LAYER:*]]"
                    optional: true
                -   name: REALIZES
                    desc: >
                        Comma-separated references to the FUNCTIONAL-REQUIREMENTS objects the
                        component realizes, i.e. whose capability its functionality delivers, so
                        that every Functional Requirement is owned by at least one component.
                    value: list([[FR.*]])
                    optional: true
                -   name: PATTERNS
                    desc: >
                        Comma-separated references to the ARCHITECTURE-PATTERNS objects the
                        structure of the component follows (e.g. the service shaped by a
                        `Hexagonal Architecture`, the publisher keeping a `Transactional Outbox`);
                        omitted for a component following no modeled pattern.
                    value: list([[PATTERN:*]])
                    optional: true
                -   name: OWNS
                    desc: >
                        Comma-separated references to the DATA-MODEL entities the component owns,
                        i.e. for which it is the single authoritative source of truth (other
                        components access an owned entity through the owner's interfaces or hold
                        derived copies only), so that every entity is owned by at most one
                        component; omitted when the component owns no entity.
                    value: list([[DM.ENTITY:*]])
                    optional: true
                -   name: PROVIDES
                    desc: >
                        Comma-separated references to the INTERFACE-MODEL objects the component
                        provides, i.e. through which other components and external entities
                        interact with it; omitted when the component provides no modeled interface
                        (e.g. a user interface or an internal module).
                    value: list([[INTERFACE:*]])
                    optional: true
                -   name: CONSUMES
                    desc: >
                        Comma-separated references to the INTERFACE-MODEL objects the component
                        consumes, i.e. the `Provided` interfaces of other components and the
                        `Required` interfaces offered by external entities, through which its
                        dependencies are exercised; omitted when the component consumes no
                        modeled interface.
                    value: list([[INTERFACE:*]])
                    optional: true
                -   name: DEPENDS-ON
                    desc: >
                        Comma-separated references to the FUNCTIONALITY-VIEW objects this component
                        depends on at runtime, naming the target component only, while the
                        interface through which a dependency is exercised is stated by `CONSUMES`
                        where modeled.
                    value: list([[FV.COMPONENT:*]])
                    optional: true

-   kind: ARCH
    name: Technology Stack
    id: TS
    file: 26-ARCH-TS-Technology-Stack.md
    desc: >
        The concrete technology products the solution is built upon, organized by tier and lifecycle
        phase, recording for each component its chosen product, its purpose, and the alternatives
        that were considered but not chosen.
    optional: true
    refs: >
        -   Starke/Hruschka: arc42 Template: Solution Strategy and Crosscutting Concepts (2005),
            https://arc42.org/overview
        -   Brown: The C4 Model: Container Diagram (2018),
            https://c4model.com/diagrams/container
    diagram:
        type: grid
        nodes: "[[TS.TIER:*]], [[TS.TIER:*.COMPONENT:*]]"
        nest:
            parent: true
            layout: grid
        properties:
            -   PRODUCT
        config:
            size-node-width-max: 440
            grid-columns-max: 2
    children:
        -   kind: TIER
            desc: |
                The architectural tier grouping the technology components belonging to it, named
                with a short (1-2 word) summary mirroring the name of the Deployment View tier
                referencing it through `STACK`, typically one of:

                -   `Client`:     Runs on the client side (e.g. browser, desktop, mobile).
                -   `Server`:     Runs on the server side (e.g. backend, application, API).
                -   `Middleware`: Runs between client and server (e.g. message broker, gateway).
                -   `Database`:   Runs as the data store (e.g. relational or document database).
                -   `Common`:     Runs on several tiers alike (e.g. a language, a logging library,
                                  or a shared module used by client and server), so a product
                                  used on several tiers is a single component here instead of
                                  one per tier; referenced by no Deployment View tier.
            optional: true
            diagram:
                type: hub
                center: self
                nodes: "[[TS.TIER:*]], [[TS.TIER:*.COMPONENT:*]], [[DV.TIER:*]]"
                hierarchy: true
                properties:
                    -   PRODUCT
                config:
                    size-node-width-max: 440
                    size-node-height-scale: 1.75
            children:
                -   kind: COMPONENT
                    desc: >
                        A single technology component, named with a short (2-5 word) summary (e.g.
                        `UI Framework`, `Web Server`, `Relational Database`) and described in a
                        concise (1-3 sentence) paragraph by how the product is used within the
                        solution and how it fits into the overall technology stack, plus a
                        1-sentence rationale ("why") for choosing this product over the
                        alternatives.

                        A component states one product in one role on one tier: the product used
                        by several tiers alike belongs to the `Common` tier once, the lock-in
                        carrying trade-off behind the choice is a Design Decisions decision
                        referencing the component through `DECIDES`, and the functional components
                        depending on the product reference it through `USED-BY`.

                        A third-party product is linked, not documented: its `PROVENANCE`,
                        `UPSTREAM`, `VERSION`, and `LICENSE` identify it exactly, the description
                        states only how the solution uses it, and the algorithms and stages it
                        realizes reference it through their `TOOLS` instead of describing its
                        internals.
                    format:
                        type: compact
                    diagram:
                        type: hub
                        center: self
                        nodes: "[[TS.TIER:*.COMPONENT:*]], [[FV.COMPONENT:*]], [[ALGORITHM:*]],
                            [[STAGE:*]], [[CONCERN:*]], [[TACTIC:*]], [[DECISION:*]],
                            [[CODE-PATTERN:*]]"
                        labeled: true
                        qualified: true
                        properties:
                            -   PRODUCT
                            -   PHASE
                        config:
                            size-node-width-max:    440
                            size-node-height-scale: 1.75
                            hub-node-count-max:     3
                    props:
                        -   name: PRODUCT
                            desc: >
                                The concrete product, library, or framework chosen for this
                                component (e.g. `VueJS`, `Node.js`, `PostgreSQL`).
                        -   name: ALTERNATIVES
                            desc: >
                                Comma-separated names of the products which would also fit this
                                component but were not chosen (e.g. `React, Svelte`): the
                                rationale of the description states *why* the product won, this
                                property states *against what*, so it is expected whenever the
                                rationale compares the product against others; omitted when there
                                was no real alternative.
                            optional: true
                        -   name: PROVENANCE
                            desc: |
                                The origin of the product, one of:
                                -   `OpenSource`: Developed in the open by third parties and used
                                                  under an open-source license, referenced
                                                  through `UPSTREAM`.
                                -   `Commercial`: Licensed from a vendor.
                                -   `InHouse`:    Developed by the organization behind the
                                                  solution, but outside of it.
                                Omitted when the origin is of no concern to the solution.
                            value: enum(OpenSource,Commercial,InHouse)
                            optional: true
                        -   name: UPSTREAM
                            desc: >
                                The URL of the upstream source of the product (preferably its
                                source code repository), present for every `OpenSource` product
                                (which the schema cannot enforce itself), so that its internals
                                are looked up there instead of being documented here.
                            value: /https?:\/\/\S+/
                            optional: true
                        -   name: VERSION
                            desc: >
                                The version or version range of the product the solution uses
                                (e.g. `3.4.1`, `>= 2.0 < 3`), as the behavior relied upon may
                                change between versions; omitted when any current version fits.
                            optional: true
                        -   name: LICENSE
                            desc: >
                                The license under which the product is used (e.g. `MIT`,
                                `Apache-2.0`, `AGPL-3.0`, `commercial`, `in-house`), the evidence
                                for a Non-Functional Requirement of category `Compliance`;
                                omitted when the license is of no concern to the solution.
                            optional: true
                        -   name: PHASE
                            desc: |
                                The lifecycle phases in which the component is relevant, one or
                                more of:

                                -   `Build-Time`:   Used during development, compilation, or
                                                    packaging.
                                -   `Run-Time`:     Used while the solution executes in
                                                    production.
                                -   `Operate-Time`: Used to operate the solution in production
                                                    (e.g. for rollout, monitoring, or backup),
                                                    referenced by the Operations View concerns
                                                    through `TOOLS`.
                            value: tags(Build-Time,Run-Time,Operate-Time)
                        -   name: COVERAGE
                            desc: |
                                A comma-separated list of the aspects the component covers, drawn
                                from the catalog of its `PHASE`: for `Build-Time` the *Build-Time
                                Aspects* (the categories of the Development Aspects), for
                                `Operate-Time` the *Operate-Time Aspects* (the categories of the
                                Operations View concerns), and for `Run-Time` the *Client*,
                                *Server*, *Middleware*, or *Database Aspects* of the component's
                                `TIER` (a `Common` tier component draws from the catalogs of all
                                tiers it serves), each defined below with its typical sub-aspects
                                as an explanation only. The general goal is to achieve a maximum
                                coverage of all aspects per tier and phase with the minimum total
                                number of `PRODUCT`s.

                                The *Build-Time Aspects* which usually have to be covered (the
                                Development Aspects `CATEGORY` values):
                                -   **Structure**:
                                    Module Layout, Package Layout, Workspace.
                                -   **Build**:
                                    Compilation, Transpilation, Bundling, Packaging.
                                -   **Dependency**:
                                    Dependency Management, Lock File, Vulnerability Audit.
                                -   **Codeline**:
                                    Version Control, Branching, Merging, Versioning, Release
                                    Tagging.
                                -   **Standardization**:
                                    Linting, Formatting, Type Checking, Coding Conventions.
                                -   **Testing**:
                                    Unit Testing, Integration Testing, End-to-End Testing,
                                    Coverage Measurement.
                                -   **Tooling**:
                                    Task Running, Code Generation, Development Automation.

                                The *Operate-Time Aspects* which usually have to be covered (the
                                Operations View `CATEGORY` values):
                                -   **Installation**:
                                    Provisioning, Container Orchestration, Infrastructure as
                                    Code.
                                -   **Configuration**:
                                    Configuration Management, Secret Management, Environment
                                    Files.
                                -   **Migration**:
                                    Data Migration, Schema Migration, Environment Promotion.
                                -   **Monitoring**:
                                    Metrics, Health Checks, Dashboards, Tracing.
                                -   **Logging**:
                                    Log Collection, Log Retention, Log Inspection.
                                -   **Alerting**:
                                    Notification, Escalation, On-Call Paging.
                                -   **Backup**:
                                    Dumps, Snapshots, Backup Storage.
                                -   **Recovery**:
                                    Restore, Failover, Point-in-Time Recovery.
                                -   **Upgrade**:
                                    Rollout, Rolling Update, Rollback, Image Distribution.
                                -   **Capacity**:
                                    Scaling, Autoscaling, Capacity Planning.
                                -   **Administration**:
                                    User Administration, Data Retention, Certificate Rotation.
                                -   **Incident**:
                                    Troubleshooting, Diagnostics, Post-Mortem.
                                -   **Support**:
                                    Ticketing, Knowledge Base, Escalation.

                                The *Client Aspects* which usually have to be covered (at least
                                for clients in a Rich-Client architecture):

                                -   **Interface Theme**:
                                    Style Reset, Shape, Color, Gradient, Shadow, Font, Icon.
                                -   **Interface Widgets**:
                                    Icon, Label, Text Paragraph, Image, Form, Text-Field,
                                    Text-Area, Date Picker, Toggle, Radio Button, Checkbox,
                                    Select List, Slider, Progress Bar, Hyperlink, Popup Menu,
                                    Dropdown Menu, Toolbar, Tooltip, Tab, Pill, Breadcrumb,
                                    Pagination, Badge, Alert, Panel, Modal, Table, Scrollbar,
                                    Carousel.
                                -   **Interface Layouting**:
                                    Responsive Design, Media Query, Frame, Grid, Padding, Border,
                                    Margin, Alignment, Force, Magnetism.
                                -   **Interface Effects**:
                                    Transition, Transformation, Keyframes, Easing Function, Sound
                                    Effect, Physics.
                                -   **Interface Interactions**:
                                    Mouse, Keyboard, Touchscreen, Gesture, Clipboard, Drag & Drop.
                                -   **Interface States**:
                                    Rendered, Enabled, Visible, Focused, Warning, Error, Floating.
                                -   **Interface Mask**:
                                    Markup Loading, Markup Generation, Virtual DOM, Text, Bitmaps,
                                    Vectors, 2D/3D Canvas, Accessibility.
                                -   **Interface Internationalization**:
                                    Text Internationalization (I18N).
                                -   **Data Conversion**:
                                    Value Formatting, Value Parsing, Localization (L10N).
                                -   **Data Binding**:
                                    Reactive, Observer, Unidirectional, Bidirectional, Incremental.
                                -   **Presentation Model**:
                                    Parameter Value, Command Value, State Value, Data Value, Event
                                    Value, Value Validation, Presentation Logic.
                                -   **Dialog Navigation**:
                                    Deep Linking, Routing, Dialog Flow.
                                -   **Dialog Automation**:
                                    Dialog Macros, Click-Through, Smoke Testing.
                                -   **Dialog Communication**:
                                    Service, Event, Model, Socket, Hooks.
                                -   **Dialog Life-Cycle**:
                                    Component States, Component State Transitions.
                                -   **Dialog Structure**:
                                    Component, Model/View/Controller Roles, Hierarchical
                                    Composition.
                                -   **State Persistence**:
                                    Local Storage, Cookies, Caching.
                                -   **Business Model**:
                                    Entity, Field, Relationship, Universally Unique Identifiers
                                    (UUID).
                                -   **Use-Case Authorization**:
                                    User Experience, Dialog Restriction, User, Group, Role,
                                    Use-Case, Data, Access.
                                -   **Client Networking**:
                                    Request/Response, Synchronization, Push, Pull, Pulled-Push,
                                    REST, GraphQL, Authentication, Session.
                                -   **Environment Detection**:
                                    Runtime Detection, Feature Detection.

                                The *Server Aspects* which usually have to be covered (at least
                                for servers, sometimes called Thin-Servers, in a Rich-Client
                                architecture):

                                -   **Environment Detection**:
                                    Operating System, Execution Platform, Network Topology,
                                    Feature Toggles.
                                -   **Argument Parsing**:
                                    CLI Options, CLI Arguments, Bootstrapping Parameters.
                                -   **Configuration Parsing**:
                                    Configuration File, Environment Variables, Directives.
                                -   **Process Daemonizing**:
                                    Terminal Detaching, Host Process Detaching, PID File.
                                -   **Process Management**:
                                    Pre-Forking, Child Processes, Threads, Supervision.
                                -   **Component Management**:
                                    Component Structure, Instantiation, Component Life-Cycle.
                                -   **Component Communication**:
                                    Events, Hooks, Registry, Dependency Injection.
                                -   **Server Networking**:
                                    Socket Listening, Connection Acceptance, Request/Response,
                                    Messaging.
                                -   **Peer Information**:
                                    Peer Identification, Peer Address, User Agent.
                                -   **Session Handling**:
                                    Session State, Session Security, Session Expiry.
                                -   **User Authentication**:
                                    Identity, Credentials, Tokens, Single Sign-On.
                                -   **Request Validation**:
                                    Syntax Validation, Semantic Validation, Sanitizing.
                                -   **Request Processing**:
                                    Dispatching, Routing, Context Determination.
                                -   **Role Authorization**:
                                    Role, Permission, Access Control.
                                -   **Client Networking**:
                                    Peer Connection, Request/Response, Publish/Subscribe.
                                -   **Task Scheduling**:
                                    Recurring Tasks, Cron, Job Queue.
                                -   **Execution Tracing**:
                                    Logging, Metrics, Measurement, Tracing.
                                -   **Database Access**:
                                    Object-Relational Mapping, Query Building, Entity Mapping.
                                -   **Database Connectivity**:
                                    Driver, Connection Pooling, Local/Remote Connection.
                                -   **Database Schema**:
                                    Schema Creation, Schema Upgrade, Schema Downgrade.
                                -   **Database Bootstrapping**:
                                    Mandatory Data, Domain Data, Seeding, Fixtures.

                                The *Middleware Aspects* which usually have to be covered (at
                                least for solutions with a dedicated tier between client and
                                server):

                                -   **Message Brokering**:
                                    Publish/Subscribe, Queues, Topics, Delivery Guarantees,
                                    Retention.
                                -   **Request Routing**:
                                    API Gateway, Reverse Proxy, Path Routing, Rewriting.
                                -   **Load Balancing**:
                                    Distribution, Health Checks, Sticky Sessions, Failover.
                                -   **Transport Security**:
                                    TLS Termination, Certificates, Mutual TLS, Firewalling.
                                -   **Content Caching**:
                                    Response Caching, Content Delivery, Compression.
                                -   **Traffic Control**:
                                    Rate Limiting, Throttling, Circuit Breaking, Retry.
                                -   **Service Discovery**:
                                    Registry, Naming, Configuration Distribution.
                                -   **Identity Federation**:
                                    OAuth, OpenID Connect, SAML, Token Exchange.

                                The *Database Aspects* which usually have to be covered (at
                                least for solutions with a data store of their own):

                                -   **Storage Engine**:
                                    Row Store, Column Store, Document Store, Key-Value Store,
                                    Graph Store, Time Series, Binary Assets.
                                -   **Transaction Management**:
                                    ACID, Isolation Levels, Locking, Multi-Version Concurrency.
                                -   **Query Language**:
                                    SQL, Query DSL, Stored Procedures, Views.
                                -   **Indexing**:
                                    B-Tree, Hash, Full-Text Search, Geospatial, Vector.
                                -   **Replication**:
                                    Primary/Replica, Multi-Primary, Failover, Sharding.
                                -   **Database Security**:
                                    Encryption at Rest, Access Control, Auditing.

                            value: tags(Structure,Build,Dependency,Codeline,Standardization,Testing,Tooling,
                                Installation,Configuration,Migration,Monitoring,Logging,Alerting,Backup,
                                Recovery,Upgrade,Capacity,Administration,Incident,Support,
                                "Interface Theme","Interface Widgets","Interface Layouting","Interface Effects",
                                "Interface Interactions","Interface States","Interface Mask",
                                "Interface Internationalization","Data Conversion","Data Binding",
                                "Presentation Model","Dialog Navigation","Dialog Automation",
                                "Dialog Communication","Dialog Life-Cycle","Dialog Structure",
                                "State Persistence","Business Model","Use-Case Authorization",
                                "Client Networking","Environment Detection",
                                "Argument Parsing","Configuration Parsing","Process Daemonizing",
                                "Process Management","Component Management","Component Communication",
                                "Server Networking","Peer Information","Session Handling",
                                "User Authentication","Request Validation","Request Processing",
                                "Role Authorization","Task Scheduling","Execution Tracing",
                                "Database Access","Database Connectivity","Database Schema",
                                "Database Bootstrapping",
                                "Message Brokering","Request Routing","Load Balancing","Transport Security",
                                "Content Caching","Traffic Control","Service Discovery","Identity Federation",
                                "Storage Engine","Transaction Management","Query Language","Indexing",

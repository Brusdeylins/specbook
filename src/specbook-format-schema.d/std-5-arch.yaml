-   kind: ARCH
    name: Development Aspects
    id: DA
    file: 27-ARCH-DA-Development-Aspects.md
    desc: >
        The architecture supporting the software development process, defining the module
        organization, build approach, and codeline conventions. The artifact is absent when the
        development conventions are governed outside the specification (e.g. by repository-level
        contributor instructions).
    optional: true
    refs: >
        -   Rozanski/Woods: Software Systems Architecture, 2nd ed.: The Development Viewpoint (2011),
            https://www.viewpoints-and-perspectives.info/home/viewpoints/development/
        -   Kruchten: Architectural Blueprints -- The "4+1" View Model of Software Architecture (1995),
            https://ieeexplore.ieee.org/document/469759
        -   Clements et al.: Documenting Software Architectures: Views and Beyond, 2nd ed. (2010),
            https://www.informit.com/store/documenting-software-architectures-views-and-beyond-9780321552686
    diagram:
        type: grid
        nodes: "[[ASPECT:*]]"
        properties:
            -   CATEGORY
    children:
        -   kind: ASPECT
            desc: >
                A single development aspect, named with a short (2-5 word) summary (e.g. `Module
                Layering`, `Build Pipeline`, `Branching Model`) and described in a concise (1-3
                sentence) paragraph by the development convention or structure and the rule
                developers must follow, plus a 1-sentence rationale ("why").

                An aspect states a standing developer-facing rule about the source structure and
                process: it names no concrete products (a Technology Stack `Build-Time` component
                states the product choice), does not restate the runtime structure (a Functionality
                View `Module` or `Subsystem` groups the logic), does not cover production
                procedures (an Operations View concern does), does not prescribe how a concern is
                coded (a Code Patterns pattern shows that as a listing), the tenet the rule
                concretizes is an Architecture Tenets maxim or principle referenced through
                `GUIDED-BY`, and the trade-off that
                produced a rule is a Design Decisions decision referencing the aspect through
                `AFFECTS`, while the quality the rule protects (usually a `Maintainability`
                requirement) is
                addressed by a Quality Perspectives tactic referencing the aspect through
                `AFFECTS`, too, so the hub diagram of an aspect shows the tenet, the decision, and
                the tactic behind it.
            optional: true
            diagram:
                type: hub
                center: self
                nodes: "[[ASPECT:*]], [[MAXIM:*]], [[AT.PRINCIPLE:*]], [[TACTIC:*]], [[DECISION:*]]"
                labeled: true
                qualified: true
                properties:
                    -   CATEGORY
                config:
                    size-node-width-max:    440
                    size-node-height-scale: 1.75
            props:
                -   name: CATEGORY
                    desc: >
                        The development concern the aspect governs: `Structure` (the physical
                        source module/package layout), `Build` (compilation and packaging),
                        `Dependency` (the allowed dependency edges between the structures),
                        `Codeline` (branching, merging, versioning), `Standardization` (coding
                        standards and conventions), `Testing` (test conventions, layout, and
                        coverage rules), or `Tooling` (development tools and automation).
                    value: enum(Structure,Build,Dependency,Codeline,Standardization,Testing,Tooling)
                -   name: GUIDED-BY
                    desc: >
                        Comma-separated references to the ARCHITECTURE-TENETS objects the aspect
                        concretizes for the source structure and process (e.g. the module
                        layering following a `Dependencies Point Inward` principle); omitted for
                        an aspect concretizing no modeled tenet.
                    value: list([[MAXIM:*]], [[AT.PRINCIPLE:*]])
                    optional: true

-   kind: ARCH
    name: Concurrency View
    id: CO
    file: 28-ARCH-CO-Concurrency-View.md
    desc: >
        The concurrency structure of the solution, mapping functional components to processes and
        threads, and defining how they coordinate and communicate. The artifact is absent when the
        solution runs as a single sequential unit of execution and has no concurrency structure
        worth describing.
    optional: true
    refs: >
        -   Rozanski/Woods: Software Systems Architecture, 2nd ed.: The Concurrency Viewpoint (2011),
            https://www.viewpoints-and-perspectives.info/home/viewpoints/concurrency/
        -   Kruchten: Architectural Blueprints -- The "4+1" View Model of Software Architecture (1995),
            https://ieeexplore.ieee.org/document/469759
        -   Schmidt et al.: Pattern-Oriented Software Architecture, Volume 2: Patterns for Concurrent and Networked Objects (2000),
            https://www.wiley.com/en-us/Pattern+Oriented+Software+Architecture,+Volume+2,+Patterns+for+Concurrent+and+Networked+Objects-p-9781118725177
    diagram:
        type: graph
        nodes: "[[UNIT:*]]"
        labeled: true
        shapes:
            -   property: KIND
                value: Pool
                shape: stack
        properties:
            -   KIND
    children:
        -   kind: UNIT
            desc: >
                A single concurrency unit, named with a short (2-5 word) summary (e.g. `Web Worker
                Pool`, `Background Scheduler`, `Ingest Queue Consumer`) and described in a concise
                (1-3 sentence) paragraph by how it executes and how it avoids or manages contention,
                races, and deadlocks (including its start order and failure/restart behavior where
                non-obvious), plus a 1-sentence rationale ("why") for the chosen concurrency
                structure.

                A unit executes work at runtime: a queue or channel between units is not a unit
                but the coordination mechanism stated in `COORDINATION`, its contract an Interface
                Model interface (e.g. of kind `MQTT` or `WebSocket`), and the platform element
                hosting a managed broker a Deployment View `Managed` node -- only the executing
                structure itself belongs to the Concurrency View. The in-memory structures shared
                between units are Processing View structures, which reference the units accessing
                them through `ACCESSED-BY` and state their `SYNCHRONIZATION`.
            optional: true
            mixins:
                -   EVIDENCE
            diagram:
                type: hub
                center: self
                nodes: "[[UNIT:*]], [[FV.COMPONENT:*]], [[STRUCTURE:*]], [[STAGE:*]], [[NODE:*]],
                    [[TACTIC:*]], [[DECISION:*]], [[SYMBOL:*]]"
                labeled: true
                qualified: true
                properties:
                    -   KIND
                config:
                    size-node-width-max:    440
                    size-node-height-scale: 1.75
                    hub-node-count-max:     3
            props:
                -   name: KIND
                    desc: |
                        The kind of the concurrency unit, one of:

                        -   `Process`:   An independent OS process with its own address space.
                        -   `Thread`:    A thread of execution within a process.
                        -   `Task`:      A lightweight cooperative task (e.g. coroutine, fiber).
                        -   `Pool`:      A managed group of interchangeable workers.
                        -   `EventLoop`: A single-threaded cooperative scheduler of tasks.
                    value: enum(Process,Thread,Task,Pool,EventLoop)
                -   name: PART-OF
                    desc: >
                        Reference to the CONCURRENCY-VIEW object this unit is contained in,
                        expressing the containment the kinds imply: a `Thread`, `Task`, `Pool`, or
                        `EventLoop` references the `Process` it executes within, and a `Task` the
                        `EventLoop` or `Pool` scheduling it; omitted for a top-level unit.
                    value: "[[UNIT:*]]"
                    optional: true
                    acyclic: true
                -   name: HOSTS
                    desc: >
                        Comma-separated references to the FUNCTIONALITY-VIEW objects that run inside
                        this concurrency unit; omitted when no modeled component runs inside it.
                    value: list([[FV.COMPONENT:*]])
                    optional: true
                -   name: MULTIPLICITY
                    desc: >
                        How many instances of the unit run (e.g. `1`, `1 per CPU core`, `0..n
                        auto-scaled`).
                -   name: COORDINATES-WITH
                    desc: >
                        Comma-separated references to the CONCURRENCY-VIEW objects this unit
                        coordinates or communicates with at runtime, naming the peer unit only
                        (e.g. a producer names the consumer it feeds through a shared queue),
                        while the mechanism is stated by `COORDINATION`.
                    value: list([[UNIT:*]])
                    optional: true
                -   name: COORDINATION
                    desc: >
                        The mechanism by which the unit coordinates or communicates with other
                        units, usually those referenced in `COORDINATES-WITH` (e.g. `shared
                        queue`, `mutex`, `message passing`, `optimistic locking`).

-   kind: ARCH
    name: Named Constants
    id: NC
    file: 35-ARCH-NC-Named-Constants.md
    desc: >
        The named values the solution is built around and tuned by -- limits, defaults, sizes,
        durations, budgets, tolerances, and identifiers (e.g. a maximum message size, a retry
        interval, a buffer capacity, a well-known port, a magic number) -- each stated once with
        its value, unit, and effect, so that the structures, algorithms, stages, tactics,
        decisions, code, and tests reference one authoritative value instead of repeating a
        literal. The artifact is absent when the solution has no such values worth stating.

        The constants form one central catalog instead of being scattered as child objects over
        the artifacts using them, as a value is usually shared by several of them (e.g. a buffer
        capacity sized by the structure, consumed by the stage, and verified by the test case),
        and as an unreferenced constant is detected as dead weight only in one place. A constant
        is internal to the solution: a value agreed upon with the consumers of an interface is a
        `CONSTANT` of an Interface Datatypes type, and a quality bound the solution has to meet
        is the `METRIC` of a Non-Functional Requirement, which a constant may realize and then
        references through `DRIVEN-BY`.
    optional: true
    refs: >
        -   McConnell: Code Complete, 2nd ed.: Named Constants (2004),
            https://www.microsoftpressstore.com/store/code-complete-9780735619678
        -   Fowler: Refactoring, 2nd ed.: Replace Magic Literal (2018),
            https://refactoring.com/catalog/replaceMagicLiteral.html
    diagram:
        type: grid
        nodes: "[[NC.CONSTANT:*]]"
        properties:
            -   CLASS
            -   VALUE
        config:
            grid-columns-max: 4
    children:
        -   kind: CONSTANT
            desc: >
                A single named value, named with its identifier in the code where one exists
                (e.g. `MAX_MESSAGE_SIZE`, `retryInterval`) or else with a short (2-5 word)
                summary (e.g. `Reconnect Back-Off`), and described in a concise (1-2 sentence)
                paragraph by what the value governs, plus a 1-sentence rationale ("why") for the
                value itself (e.g. the measurement, standard, or trade-off it stems from).

                A constant is referenced by the objects using it (a structure through its
                `CAPACITY`, an algorithm or stage through its `PARAMETERS` or `BUDGET`, a tactic
                or decision through its `AFFECTS`, a symbol through its `IMPLEMENTS`, a test case
                through its `VERIFIES`) and references nothing of them itself, so that the
                references keep pointing backward and a constant used by no modeled element is
                reported.
            optional: true
            referenced:
                -   "[[*]]"
            mixins:
                -   EVIDENCE
            format:
                type: compact
            diagram:
                type: hub
                center: self
                nodes: "[[NC.CONSTANT:*]], [[NR.REQUIREMENT:*]], [[PREMISE:*]], [[STRUCTURE:*]],
                    [[ALGORITHM:*]], [[STAGE:*]], [[TACTIC:*]], [[DECISION:*]], [[SYMBOL:*]],
                    [[TEST-CASE:*]]"
                labeled: true
                qualified: true
                config:
                    size-node-width-max: 440
            props:
                -   name: CLASS
                    desc: |
                        The class of the value, one of:
                        -   `Limit`:      A bound the solution enforces (e.g. a maximum number of
                                          connections, a minimum free disk space).
                        -   `Default`:    The initial value of a setting which may be changed
                                          (e.g. a default page size).
                        -   `Size`:       A dimension of a structure or a unit of work (e.g. a
                                          buffer capacity, a block size, a batch size).
                        -   `Duration`:   A span of time (e.g. a timeout, a polling interval, a
                                          retry delay).
                        -   `Budget`:     An allowance of a resource an operation may consume
                                          (e.g. a time budget per cycle, a memory budget).
                        -   `Tolerance`:  An admissible deviation (e.g. an epsilon, a clock drift,
                                          a jitter).
                        -   `Identifier`: A fixed code, key, or address (e.g. a port, a magic
                                          number, a well-known name).
                        -   `Other`:      Any other value, explained in the description.
                    value: enum(Limit,Default,Size,Duration,Budget,Tolerance,Identifier,Other)
                -   name: VALUE
                    desc: >
                        The literal value of the constant (e.g. `65536`, `0x1F8B`, `250`), or the
                        expression it is computed from in the code (e.g. `2 * BLOCK_SIZE`), the
                        unit stated separately.
                    value: /.+/
                -   name: UNIT
                    desc: >
                        The unit of the value (e.g. `bytes`, `ms`, `items`, `%`, `samples`);
                        omitted for a dimensionless value.
                    optional: true
                -   name: EFFECT
                    desc: >
                        What changes when the value is raised or lowered (e.g. `higher: more
                        memory, fewer stalls -- lower: less latency, more drops`), so that a tuning
                        decision can be made without re-analyzing the solution; omitted for an
                        `Identifier`, which is not tunable.
                    optional: true
                -   name: DRIVEN-BY
                    desc: >
                        Comma-separated references to the NON-FUNCTIONAL-REQUIREMENTS or
                        SOLUTION-PREMISES objects the value realizes (e.g. the latency requirement
                        a time budget is derived from, the hardware premise a buffer size is fitted
                        to); omitted for a value grounded in its rationale alone.
                    value: list([[NR.*]], [[PREMISE:*]])
                    optional: true

-   kind: ARCH
    name: Processing View
    id: PV
    file: 36-ARCH-PV-Processing-View.md
    desc: >
        The internal processing of the solution below its functional components: the in-memory
        data structures it keeps, the algorithms and compute kernels it runs, and the pipelines
        through whose ordered stages its data flows, each tied to the components owning it, the
        concurrency units executing it, the types it consumes and produces, and the named
        constants governing it. The artifact is absent when the solution has no internal
        processing beyond the responsibilities of its components worth describing.

        The view follows the Functionality View, the Concurrency View, and the Named Constants,
        as its elements are finer-grained than the components and units and reference them
        together with the constants and the Interface Datatypes types, while the Quality
        Perspectives, Design Decisions, Code Patterns, Code Map, and Test Cases following it
        reference its elements in turn. Only the realization of the solution itself is described:
        a structure, algorithm, or stage which is merely a third-party product references its
        Technology Stack component through `TOOLS` instead of documenting its internals.
    optional: true
    refs: >
        -   Rozanski/Woods: Software Systems Architecture, 2nd ed.: The Information Viewpoint (2011),
            https://www.viewpoints-and-perspectives.info/home/viewpoints/information/
        -   Buschmann et al.: Pattern-Oriented Software Architecture, Vol. 1: Pipes and Filters (1996),
            https://www.wiley.com/en-us/Pattern+Oriented+Software+Architecture%2C+Volume+1%2C+A+System+of+Patterns-p-9780471958697
        -   Cormen/Leiserson/Rivest/Stein: Introduction to Algorithms, 4th ed. (2022),
            https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/
    diagram:
        type: graph
        nodes: "[[STRUCTURE:*]], [[ALGORITHM:*]], [[PIPELINE:*]]"
        deep: true
        labeled: true
        qualified: true
        nest:
            kind: true
        config:
            size-node-width-max: 440
    children:
        -   kind: STRUCTURE
            desc: >
                A single in-memory data structure, named with a short (2-5 word) summary (e.g.
                `Request Queue`, `Session Table`, `Block Cache`) and described in a concise (1-3
                sentence) paragraph by what the structure holds and how it is used, plus a
                1-sentence rationale ("why") for its shape.

                A structure differs from a named constant by having a shape, an owner, a lifetime,
                and a synchronization, and from a Data Model entity by living in memory only for
                the processing (a persisted entity is a Data Model entity, its in-memory cache or
                index is a structure). It belongs neither to the Functionality View nor to the
                Concurrency View, as it references both its owning component and the concurrency
                units accessing it.
            optional: true
            mixins:
                -   EVIDENCE
            format:
                type: compact
            diagram:
                type: hub
                center: self
                nodes: "[[STRUCTURE:*]], [[FV.COMPONENT:*]], [[UNIT:*]], [[NC.CONSTANT:*]],
                    [[TYPE:*]], [[DM.ENTITY:*]], [[ALGORITHM:*]], [[STAGE:*]], [[TACTIC:*]],
                    [[DECISION:*]], [[CODE-PATTERN:*]], [[SYMBOL:*]], [[TEST-CASE:*]]"
                labeled: true
                qualified: true
                properties:
                    -   KIND
                config:
                    size-node-width-max:    440
                    size-node-height-scale: 1.75
                    hub-node-count-max:     3
            props:
                -   name: KIND
                    desc: |
                        The kind of the structure, one of:
                        -   `Buffer`: A contiguous region holding data in transit (e.g. a ring
                                      buffer, a scratch area).
                        -   `Queue`:  An ordered hand-over of items between producers and
                                      consumers.
                        -   `Pool`:   A set of reusable, preallocated objects or resources.
                        -   `Cache`:  A copy of data kept for faster repeated access.
                        -   `Table`:  A keyed lookup structure (e.g. a map, an index, a
                                      registry).
                        -   `State`:  The working state of a process or session (e.g. a context
                                      object, a state vector).
                        -   `Other`:  Any other structure, explained in the description.
                    value: enum(Buffer,Queue,Pool,Cache,Table,State,Other)
                -   name: LAYOUT
                    desc: >
                        The shape of the structure: the element type (referencing an
                        INTERFACE-DATATYPES type where modeled), the arrangement of the elements
                        (e.g. `array of 16-byte slots`, `hash map keyed by session id`), and,
                        where it matters, the alignment and padding.
                    optional: true
                -   name: CAPACITY
                    desc: >
                        Reference to the NAMED-CONSTANTS object bounding the number or size of the
                        elements, or `unbounded` for a structure growing without a bound (which
                        the rationale then has to justify).
                    value: list([[NC.CONSTANT:*]], /unbounded/)
                    optional: true
                -   name: OWNER
                    desc: >
                        Reference to the FUNCTIONALITY-VIEW component owning the structure, i.e.
                        creating, releasing, and alone mutating it unless `SYNCHRONIZATION` states
                        otherwise.
                    value: "[[FV.COMPONENT:*]]"
                    optional: true
                -   name: LIFETIME
                    desc: >
                        When the structure is created and released (e.g. `process lifetime`, `per
                        session`, `per request`, `until evicted`).
                    optional: true
                -   name: ACCESSED-BY
                    desc: >
                        Comma-separated references to the CONCURRENCY-VIEW units reading or
                        writing the structure, which the structure references instead of the
                        units referencing it, as the units precede it; omitted for a structure
                        accessed by a single, obvious unit only.
                    value: list([[UNIT:*]])
                    optional: true
                -   name: SYNCHRONIZATION
                    desc: >
                        How concurrent access to the structure is made safe (e.g. `single writer,
                        lock-free readers`, `mutex per bucket`, `copy on write`, `confined to one
                        thread`), complementing the `COORDINATION` of the units accessing it.
                    optional: true
        -   kind: ALGORITHM
            desc: >
                A single algorithm or compute kernel of the solution, named with a short (2-5 word)
                summary of the computation (e.g. `Token Bucket Limiter`, `Delta Encoding`,
                `Matrix Transpose Kernel`) and described in a concise (1-3 sentence) paragraph by
                what it computes and how, plus a 1-sentence rationale ("why") for choosing this
                method.

                An algorithm and a compute kernel are one kind, told apart by their `TARGET`, as
                both are a computation with inputs, outputs, invariants, and numerics, differing
                only in the hardware they are fitted to. The listing of the essential part of the
                computation follows the description and its rationale as its elaboration, either
                a fenced code block or an embedded excerpt of the source file, exactly like the
                listing of a Code Patterns pattern. An algorithm differs from a Code Patterns
                pattern by being one particular computation instead of a recurring code shape,
                and from a Functionality View component by having no responsibility of its own
                beyond the computation; a stage of a pipeline references the algorithms it runs
                through `ALGORITHMS`, so one algorithm serves several stages.
            optional: true
            mixins:
                -   EVIDENCE
            format:
                type: complex
            diagram:
                type: hub
                center: self
                nodes: "[[ALGORITHM:*]], [[FV.COMPONENT:*]], [[NC.CONSTANT:*]], [[STRUCTURE:*]],
                    [[TYPE:*]], [[TS.TIER:*.COMPONENT:*]], [[STAGE:*]], [[TACTIC:*]],
                    [[DECISION:*]], [[CODE-PATTERN:*]], [[SYMBOL:*]], [[TEST-CASE:*]]"
                labeled: true
                qualified: true
                properties:
                    -   TARGET
                config:
                    size-node-width-max: 440
            props:
                -   name: TARGET
                    desc: |
                        The hardware the computation is fitted to, one of:
                        -   `CPU`:         Scalar code on general-purpose processor cores.
                        -   `SIMD`:        Vectorized code on the vector units of the processor.
                        -   `GPU`:         Kernels on a graphics processor.
                        -   `Accelerator`: Code on a dedicated unit (e.g. a DSP, an FPGA, an NPU).
                        -   `Distributed`: Work spread over several machines.
                    value: enum(CPU,SIMD,GPU,Accelerator,Distributed)
                -   name: OWNER
                    desc: >
                        Reference to the FUNCTIONALITY-VIEW component the computation belongs to;
                        omitted for a computation shared by several components alike.
                    value: "[[FV.COMPONENT:*]]"
                    optional: true
                -   name: INPUT
                    desc: >
                        What the computation consumes, referencing the INTERFACE-DATATYPES types
                        or the STRUCTURE objects where modeled (e.g. `[[TYPE:Record]] batch of up
                        to [[NC.CONSTANT:BATCH_SIZE]] items`).
                    optional: true
                -   name: OUTPUT
                    desc: >
                        What the computation produces, in the same terms as `INPUT`.
                    optional: true
                -   name: INVARIANTS
                    desc: >
                        The conditions holding before, during, and after the computation (e.g.
                        `output sorted by key`, `sum of weights stays 1`), which the test cases
                        verify.
                    optional: true
                -   name: COMPLEXITY
                    desc: >
                        The time and space complexity in the size of the input (e.g. `O(n log n)
                        time, O(1) extra space`).
                    optional: true
                -   name: NUMERICS
                    desc: >
                        The numeric behavior: precision, rounding, value range, overflow, and
                        determinism (e.g. `32-bit float, round to nearest, saturating at 1.0,
                        not bit-exact across targets`); omitted for a non-numeric computation.
                    optional: true
                -   name: PARAMETERS
                    desc: >
                        Comma-separated references to the NAMED-CONSTANTS objects tuning the
                        computation (e.g. a window size, a threshold, an iteration limit).
                    value: list([[NC.CONSTANT:*]])
                    optional: true
                -   name: BUDGET
                    desc: >
                        Reference to the NAMED-CONSTANTS object (usually of `CLASS` `Budget`)
                        bounding the resource one execution of the computation may consume (e.g.
                        the time per cycle); omitted for a computation without such a bound.
                    value: "[[NC.CONSTANT:*]]"
                    optional: true
                -   name: DATA-LAYOUT
                    desc: >
                        How the data is arranged in memory for the computation (e.g. `structure
                        of arrays, 32-byte aligned`, `tiles of 16x16 elements`), referencing the
                        STRUCTURE objects where modeled; omitted when the layout is of no concern.
                    optional: true
                -   name: PARALLELISM
                    desc: >
                        How the computation is split for parallel execution (e.g. `one work item
                        per element`, `rows partitioned over the worker pool`); omitted for a
                        sequential computation.
                    optional: true
                -   name: TOOLS
                    desc: >
                        Comma-separated references to the TECHNOLOGY-STACK components providing
                        the computation or its building blocks (e.g. a math library), whose
                        internals are then not documented here; omitted for a computation coded
                        by the solution alone.
                    value: list([[TS.TIER:*.COMPONENT:*]])
                    optional: true
        -   kind: PIPELINE
            desc: >
                A single processing pipeline, named with a short (2-5 word) summary of the data
                path (e.g. `Ingest Path`, `Query Execution Path`, `Firmware Update Path`) and
                described in a concise (1-3 sentence) paragraph by the data it carries, where it
                begins and ends, and how its stages are scheduled, plus a 1-sentence rationale
                ("why") for the cut of the pipeline. Its `STAGE` objects are listed in processing
                order, so the diagram of the pipeline lines them up in that order.
            optional: true
            mixins:
                -   EVIDENCE
            format:
                type: complex
            diagram:
                type: graph
                ordered: true
                labeled: true
                nest:
                    parent: true
                config:
                    size-node-width-max: 300
                    graph-columns-max:   4
            props:
                -   name: DATA
                    desc: >
                        The data carried by the pipeline, in the terms of the domain or by
                        reference to the INTERFACE-DATATYPES types (e.g. `log records`, `sensor
                        samples`, `[[TYPE:Query]] plans`).
                    optional: true
                -   name: COMPONENTS
                    desc: >
                        Comma-separated references to the FUNCTIONALITY-VIEW components executing
                        the pipeline.
                    value: list([[FV.COMPONENT:*]])
                    optional: true
                -   name: REALIZES
                    desc: >
                        Comma-separated references to the FUNCTIONAL-REQUIREMENTS objects whose
                        capability the pipeline delivers.
                    value: list([[FR.*]])
                    optional: true
            children:
                -   kind: STAGE
                    desc: >
                        A single stage of the pipeline, named with a short (2-5 word) verb phrase
                        (e.g. `Validate Records`, `Merge Partial Results`) and described by what
                        the stage does to the data and the rule it applies, plus a 1-sentence
                        rationale ("why"). A stage which is merely a third-party product references
                        it through `TOOLS` and is otherwise not elaborated.
                    optional: true
                    mixins:
                        -   EVIDENCE
                    format:
                        type: compact
                    props:
                        -   name: FED-BY
                            desc: >
                                Comma-separated references to the stages of the same pipeline
                                whose output this stage consumes, forming the edges of the
                                pipeline diagram; omitted for an entry stage, which is fed from
                                outside the pipeline as its `INPUT` states.
                            value: list([[STAGE:*]])
                            optional: true
                            local: true
                            acyclic: true
                        -   name: INPUT
                            desc: >
                                What the stage consumes, referencing the INTERFACE-DATATYPES
                                types or the STRUCTURE objects where modeled, with the exact
                                format as far as it matters (e.g. `[[TYPE:Record]] in batches`).
                            optional: true
                        -   name: OUTPUT
                            desc: >
                                What the stage produces, in the same terms as `INPUT`.
                            optional: true
                        -   name: ALGORITHMS
                            desc: >
                                Comma-separated references to the ALGORITHM objects the stage
                                runs.
                            value: list([[ALGORITHM:*]])
                            optional: true
                        -   name: PARAMETERS
                            desc: >
                                Comma-separated references to the NAMED-CONSTANTS objects
                                governing the stage beyond those of its algorithms (e.g. a
                                queue depth, a flush interval).
                            value: list([[NC.CONSTANT:*]])
                            optional: true
                        -   name: EXECUTION
                            desc: >
                                Comma-separated references to the CONCURRENCY-VIEW units
                                executing the stage, while its timing and buffering are stated
                                in the description.
                            value: list([[UNIT:*]])
                            optional: true
                        -   name: TOOLS
                            desc: >
                                Comma-separated references to the TECHNOLOGY-STACK components
                                the stage is implemented by, whose internals are then not
                                documented here; omitted for a stage coded by the solution alone.
                            value: list([[TS.TIER:*.COMPONENT:*]])
                            optional: true

-   kind: ARCH
    name: Deployment View
    id: DV
    file: 29-ARCH-DV-Deployment-View.md
    desc: >
        The environment into which the solution is deployed, partitioning it into tiers and mapping
        software elements to the runtime platform, hardware, and network topology.
    optional: true
    refs: >
        -   Rozanski/Woods: Software Systems Architecture, 2nd ed.: The Deployment Viewpoint (2011),
            https://www.viewpoints-and-perspectives.info/home/viewpoints/deployment/
        -   Kruchten: Architectural Blueprints -- The "4+1" View Model of Software Architecture (1995),
            https://ieeexplore.ieee.org/document/469759
        -   Brown: The C4 Model: Deployment Diagram (2018),
            https://c4model.com/diagrams/deployment
    diagram:
        type: graph
        nodes: "[[NODE:*]]"
        labeled: true
        qualified: true
        nest:
            properties:
                -   PART-OF
                -   TIER
        shapes:
            -   property: KIND
                value: Cluster
                shape: stack
            -   property: KIND
                value: Device
                shape: device
            -   property: KIND
                value: Managed
                shape: cloud
        properties:
            -   AREA
            -   KIND
            -   PLATFORM
        config:
            size-node-width-max: 350
    children:
        -   kind: TIER
            desc: >
                A single deployment tier, named with a short (1-3 word) summary (e.g. `Client`,
                `Server`, `Database`, `Data Center`) and described in a concise (1-3 sentence)
                paragraph by the code or data it hosts and its spatial and network separation from
                the other tiers, plus a 1-sentence rationale ("why") for the partitioning.

                A tier is a logically and spatially distinct, network-connected, technology-induced
                partition of the solution, the *horizontal* split when drawn (an `AREA` is the
                *vertical*, domain-induced one): every node belongs to exactly one tier via its
                `TIER`, a location-level tier (e.g. a data center) groups the tiers referencing it
                via `PART-OF`, and a single deployment unit within a tier is a `NODE` -- only the
                partition itself belongs here.
            optional: true
            format:
                type: concise
            diagram:
                type: hub
                center: self
                nodes: "[[DV.TIER:*]], [[NODE:*]], [[TACTIC:*]], [[DECISION:*]]"
                labeled: true
                qualified: true
                properties:
                    -   LOCATION
                    -   KIND
                config:
                    size-node-width-max:    440
                    size-node-height-scale: 1.75
                    hub-node-count-max:     3
            props:
                -   name: PART-OF
                    desc: >
                        Reference to the DEPLOYMENT-VIEW tier this tier is contained in (e.g. the
                        `Server` and `Database` tiers reference the `Data Center` tier hosting
                        them); omitted for a top-level tier.
                    value: "[[DV.TIER:*]]"
                    optional: true
                    acyclic: true
                -   name: LOCATION
                    desc: >
                        Where the tier physically runs (e.g. `Hetzner data center Nürnberg, dev/QA/prod
                        environments`, `attendee and operator devices`, `Cloudflare edge`); omitted
                        when inherited from the `PART-OF` tier.
                    optional: true
                -   name: STACK
                    desc: >
                        Reference to the TECHNOLOGY-STACK tier whose products run in this tier;
                        omitted when the Technology Stack is absent, has no matching tier, or the
                        tier (e.g. a data center) groups other tiers only.
                    value: "[[TS.TIER:*]]"
                    optional: true
        -   kind: AREA
            desc: >
                A single deployment area, named with a short (1-3 word) summary (e.g. `Ordering`,
                `Billing`, `Identity`) and described in a concise (1-3 sentence) paragraph by the
                domain it covers and its separation from the other areas, plus a 1-sentence rationale
                ("why") for the partitioning.

                An area is a logically distinct, domain-induced partition of the solution deployed
                as physical units of its own, the *vertical* split when drawn (a `TIER` is the
                *horizontal*, technology-induced one): a node dedicated to the area references it via
                its `AREA`, a node shared by several areas references none, and a domain grouping
                without deployment units of its own is a Functionality View `Subsystem` instead. The
                kind is absent when the solution is not split vertically.
            optional: true
            format:
                type: concise
            diagram:
                type: hub
                center: self
                nodes: "[[AREA:*]], [[NODE:*]], [[TACTIC:*]], [[DECISION:*]]"
                labeled: true
                qualified: true
                properties:
                    -   KIND
                config:
                    size-node-width-max:    440
                    size-node-height-scale: 1.75
        -   kind: NODE
            desc: >
                A single deployment node, named with a short (2-5 word) summary (e.g. `Web Servers`,
                `Database Cluster`, `Edge CDN`) and described in a concise (1-3 sentence) paragraph
                by the node, its sizing, and its place in the deployment topology, plus a 1-sentence
                rationale ("why") for the node's placement and platform choice.

                A node is a platform element the solution deploys onto and operates itself: a
                managed third-party service the solution merely consumes is a Context View
                `Service` entity, the software products running on the node are Technology Stack
                components (referencing the hosted components through `USED-BY`), and the procedures
                operating the node are Operations View concerns -- only the runtime environment
                itself belongs to the Deployment View, with the tier and area the node belongs to
                and the network segments it is attached to as its `TIER`, `AREA`, and `NETWORK`
                siblings.
            optional: true
            diagram:
                type: hub
                center: self
                nodes: "[[DV.TIER:*]], [[AREA:*]], [[NODE:*]], [[NETWORK:*]], [[FV.COMPONENT:*]],
                    [[UNIT:*]], [[CONCERN:*]], [[TACTIC:*]], [[DECISION:*]]"
                labeled: true
                qualified: true
                properties:
                    -   LOCATION
                    -   KIND
                    -   PLATFORM
                    -   SCOPE
                config:
                    size-node-width-max:    440
                    size-node-height-scale: 1.75
                    hub-node-count-max:     3
            props:
                -   name: KIND
                    desc: |
                        The kind of the deployment node, one of:
                        -   `Server`:    A physical or virtual machine.
                        -   `Container`: A containerized runtime (e.g. Docker, OCI).
                        -   `Cluster`:   A group of nodes managed as one (e.g. Kubernetes cluster),
                                         containing the nodes referencing it via `PART-OF`.
                        -   `Function`:  A serverless / function-as-a-service runtime.
                        -   `Device`:    An edge or client device.
                        -   `Managed`:   A managed cloud service (e.g. managed database, queue).
                    value: enum(Server,Container,Cluster,Function,Device,Managed)
                -   name: TIER
                    desc: >
                        Reference to the DEPLOYMENT-VIEW tier the node belongs to, exactly one, as a
                        single deployment unit never spans tiers.
                    value: "[[DV.TIER:*]]"
                -   name: AREA
                    desc: >
                        Reference to the DEPLOYMENT-VIEW area the node is dedicated to, at most one,
                        as a single deployment unit never spans areas; omitted for a node shared by
                        several areas or when the solution is not split vertically.
                    value: "[[AREA:*]]"
                    optional: true
                -   name: PLATFORM
                    desc: >
                        The execution platform of the node, i.e. its operating system, runtime, or
                        cloud service (e.g. `Linux x86-64`, `Kubernetes 1.30`, `AWS Lambda
                        (Node.js)`), not the software products running on it, which are Technology
                        Stack components.
                -   name: PART-OF
                    desc: >
                        Reference to the DEPLOYMENT-VIEW object this node is contained in,
                        expressing the nesting the kinds imply: a `Container` references the
                        `Server` or `Cluster` running it, and a `Server` the `Cluster` it belongs
                        to; omitted for a top-level node.
                    value: "[[NODE:*]]"
                    optional: true
                    acyclic: true
                -   name: HOSTS
                    desc: >
                        Comma-separated references to the CONCURRENCY-VIEW or FUNCTIONALITY-VIEW
                        objects deployed onto this node: the concurrency units executing on the
                        node (which themselves state the components they host), and the functional
                        components not mapped by any concurrency unit directly. A containing node
                        does not repeat what its `PART-OF` nodes host.
                    value: list([[UNIT:*]], [[FV.COMPONENT:*]])
                    optional: true
                -   name: INSTANCES
                    desc: >
                        How many instances of the node run (e.g. `1`, `3 per environment`, `0..n
                        auto-scaled`).
                    optional: true
                -   name: CONNECTS-TO
                    desc: >
                        Comma-separated references to the DEPLOYMENT-VIEW objects this node opens
                        network connections to at runtime, naming the target node only, while the
                        carried protocols are stated by the `PROTOCOLS` of the shared `NETWORK`.
                    value: list([[NODE:*]])
                    optional: true
                -   name: NETWORKS
                    desc: >
                        Comma-separated references to the DEPLOYMENT-VIEW network segments the node
                        is attached to (e.g. a public ingress and a private backend network); omitted
                        when the topology models no network segments.
                    value: list([[NETWORK:*]])
                    optional: true
        -   kind: NETWORK
            desc: >
                A single network segment the deployment nodes are attached to, named with a short
                (2-5 word) summary (e.g. `Public Internet`, `Backend VLAN`, `Database Subnet`) and
                described in a concise (1-3 sentence) paragraph by its reach, its isolation from the
                other segments, and the traffic it carries, plus a 1-sentence rationale ("why") for
                the segmentation.

                A segment is the medium the nodes communicate over: the attached nodes reference it
                via `NETWORKS`, the directed links between them are their `CONNECTS-TO` references,
                and the contract of the carried traffic is an Interface Model interface -- only the
                network itself belongs here. The kind is absent when the topology has no
                segmentation worth describing.
            optional: true
            format:
                type: concise
            diagram:
                type: hub
                center: self
                nodes: "[[NETWORK:*]], [[NODE:*]], [[TACTIC:*]], [[DECISION:*]]"
                labeled: true
                qualified: true
                properties:
                    -   KIND
                    -   SCOPE
                config:
                    size-node-width-max:    440
                    size-node-height-scale: 1.75
                    hub-node-count-max:     3
            props:
                -   name: SCOPE
                    desc: |
                        The reach of the segment, one of:
                        -   `Public`:   Reachable from the Internet.
                        -   `Private`:  Reachable from the solution's own nodes only.
                        -   `Isolated`: Reachable from selected nodes only (e.g. a database subnet).
                    value: enum(Public,Private,Isolated)
                -   name: PROTOCOLS
                    desc: >
                        The protocols and ports carried by the segment (e.g. `HTTPS 443, WSS 443`,
                        `HTTP, WS, TCP 5432`).
                -   name: ADDRESSING
                    desc: >
                        The address range or naming of the segment (e.g. `10.0.0.0/8`, `public IPv4
                        and IPv6`, `*.example.com`).
                    optional: true

-   kind: ARCH
    name: Operations View
    id: OV
    file: 30-ARCH-OV-Operations-View.md
    desc: >
        The way the solution is operated, administered, and supported in production, defining the
        standing procedures by which the operating organization installs, configures, migrates,
        observes, protects, upgrades, scales, and supports the running solution.
    optional: true
    refs: >
        -   Rozanski/Woods: Software Systems Architecture, 2nd ed.: The Operational Viewpoint (2011),
            https://www.viewpoints-and-perspectives.info/home/viewpoints/operational/
        -   Beyer et al.: Site Reliability Engineering: How Google Runs Production Systems (2016),
            https://sre.google/sre-book/table-of-contents/
        -   ISO/IEC 20000-1:2018: Information technology -- Service management -- Part 1: Service management system requirements (2018),
            https://www.iso.org/standard/70636.html
    diagram:
        type: grid
        nodes: "[[CONCERN:*]]"
        properties:
            -   CATEGORY
    children:
        -   kind: CONCERN
            desc: >
                A single operational concern, named with a short (2-5 word) summary (e.g. `Rolling
                Deployment`, `Metrics Collection`, `Backup and Restore`) and described in a concise
                (1-3 sentence) paragraph by the procedure through which it is handled in production
                and the steps and tools supporting it, plus a 1-sentence rationale ("why") for the
                operational approach.

                A concern states a standing production procedure the operating organization
                performs on the running solution: a capability the solution offers its users (even
                an administrating one) is a Functional Requirement or Use Case, an automatic
                behavior of the solution is a Domain Rule, the design tactic making the solution
                operable (e.g. replication, statelessness) is a Quality Perspectives tactic
                referencing the concern through `OPERATED-BY`, the deployment shape acted upon
                (instances, environments) is the Deployment View, the pipeline producing the
                deployable artifact is a `Build` aspect of the Development Aspects, and the products
                used are Technology Stack `Operate-Time` components referenced through `TOOLS` --
                only the procedure itself, its trigger, and its responsible operator belong here.
            optional: true
            diagram:
                type: hub
                center: self
                nodes: "[[CONCERN:*]], [[NR.REQUIREMENT:*]], [[PERSONA:*]], [[TACTIC:*]],
                    [[FV.COMPONENT:*]], [[UNIT:*]], [[NODE:*]], [[DM.ENTITY:*]],
                    [[TS.TIER:*.COMPONENT:*]]"
                labeled: true
                qualified: true
                properties:
                    -   CATEGORY
                config:
                    size-node-width-max:    440
                    size-node-height-scale: 1.75
                    hub-node-count-max:     3
            props:
                -   name: CATEGORY
                    desc: |
                        The category of the concern, one of:
                        -   `Installation`:   Provisioning the environments and installing the
                                              solution into them.
                        -   `Configuration`:  Managing the configuration of the installed solution.
                        -   `Migration`:      Moving data or functionality between versions or
                                              environments.
                        -   `Monitoring`:     Observing the health and performance of the running
                                              solution.
                        -   `Logging`:        Collecting, retaining, and inspecting the logs.
                        -   `Alerting`:       Notifying the operators of conditions requiring
                                              attention.
                        -   `Backup`:         Preserving the data and state of the solution.
                        -   `Recovery`:       Restoring the solution after a failure or data loss.
                        -   `Upgrade`:        Rolling out new versions of the solution.
                        -   `Capacity`:       Scaling the solution and planning its capacity.
                        -   `Administration`: Routine housekeeping (e.g. user administration, data
                                              retention, certificate rotation).
                        -   `Incident`:       Troubleshooting and responding to incidents.
                        -   `Support`:        Handling the requests of the users through the support
                                              tiers and their escalation.
                    value: enum(Installation,Configuration,Migration,Monitoring,Logging,Alerting,Backup,Recovery,Upgrade,Capacity,Administration,Incident,Support)
                -   name: TRIGGER
                    desc: >
                        When the procedure is performed (e.g. `nightly`, `on release`, `on alert`,
                        `before each event`, `on demand`), separating the routine (scheduled)
                        concerns from the reactive (event-driven) ones.
                -   name: OPERATOR
                    desc: >
                        Comma-separated references to the User Personas objects performing the
                        procedure, usually a `Stakeholder` persona like the operations team (a
                        procedure performed by a `User` persona through the solution is a Use Case
                        instead); omitted when no persona of the operating organization is modeled.
                    value: list([[PERSONA:*]])
                    optional: true
                -   name: ADDRESSES
                    desc: >
                        Comma-separated references to the NON-FUNCTIONAL-REQUIREMENTS objects the
                        procedure fulfills (e.g. a recovery objective, a retention obligation);
                        omitted when the concern fulfills no stated requirement.
                    value: list([[NR.*]])
                    optional: true
                -   name: ELEMENTS
                    desc: >
                        Comma-separated references to the FUNCTIONALITY-VIEW, CONCURRENCY-VIEW,
                        DEPLOYMENT-VIEW, or DATA-MODEL objects the procedure acts upon (e.g. the
                        nodes scaled, the units restarted, the entities backed up or migrated).
                    value: list([[FV.COMPONENT:*]], [[UNIT:*]], [[DV.TIER:*]], [[AREA:*]],
                        [[NODE:*]], [[NETWORK:*]], [[DM.ENTITY:*]])
                    optional: true
                -   name: TOOLS
                    desc: >
                        Comma-separated references to the TECHNOLOGY-STACK components (usually of
                        `PHASE` `Operate-Time`) supporting the procedure; omitted when the procedure
                        uses no modeled product.
                    value: list([[TS.TIER:*.COMPONENT:*]])
                    optional: true

-   kind: ARCH
    name: Quality Perspectives
    id: QP
    file: 31-ARCH-QP-Quality-Perspectives.md
    desc: >
        How the Non-Functional Requirements (NR) are addressed by the architecture, through the
        tactics built into the solution across the views.
    optional: true
    refs: >
        -   Rozanski/Woods: Software Systems Architecture, 2nd ed.: The Perspectives (2011),
            https://www.viewpoints-and-perspectives.info/home/perspectives/
        -   Bass/Clements/Kazman: Software Architecture in Practice, 4th ed. (2021),
            https://www.informit.com/store/software-architecture-in-practice-9780136886099
        -   ISO/IEC 25010:2023: Systems and software engineering -- Systems and software Quality Requirements and Evaluation (SQuaRE) -- Product quality model (2023),
            https://www.iso.org/standard/78176.html
    diagram:
        type: grid
        nodes: "[[TACTIC:*]]"
        properties:
            -   QUALITY
    children:
        -   kind: TACTIC
            desc: >
                A single quality tactic, one architectural tactic applied to one quality attribute
                (the perspective in the sense of Rozanski/Woods, i.e. the cross-cutting quality
                concern applied to the elements of all views, identified by `QUALITY`), named with
                a short (2-5 word) summary (e.g. `Horizontal Scaling`, `Defense in Depth`,
                `Graceful Degradation`) and described in a concise (1-3 sentence) paragraph by how
                the tactic satisfies the quality attribute across the affected elements, plus a
                1-sentence rationale ("why") for the tactic satisfying the addressed requirements
                (not for choosing it over alternatives, which is the rationale of a Design
                Decisions decision).

                A tactic states a design mechanism built into the solution: the threshold the
                mechanism has to meet is the `METRIC` of the addressed Non-Functional Requirement
                and is not restated, the production procedure performed against the mechanism
                (e.g. scaling out, restoring) is an Operations View concern referenced through
                `OPERATED-BY`, the tenet the mechanism follows is an Architecture Tenets maxim or
                principle referenced through `GUIDED-BY`, the structure it is built from is an
                Architecture Patterns pattern referenced through `PATTERNS`, the trade-off that
                chose the mechanism
                over alternatives is a
                Design Decisions decision referencing the tactic through `DECIDES`, the product
                realizing the mechanism is a Technology Stack component referenced through
                `TOOLS`, the developer-facing rule about the source structure is an aspect of the
                Development Aspects, the coded form of the mechanism is a Code Patterns pattern
                referencing the tactic through `REALIZES`, and a mechanism driven solely by a
                `Constraint` requirement
                (e.g. a hosting or budget mandate) protects no quality and is a Design Decisions
                decision alone -- only the mechanism, the quality it achieves, and the elements it
                shapes belong here.
            optional: true
            format:
                type: compact
            diagram:
                type: hub
                center: self
                nodes: "[[TACTIC:*]], [[NR.REQUIREMENT:*]], [[MAXIM:*]], [[AT.PRINCIPLE:*]],
                    [[PATTERN:*]], [[FV.COMPONENT:*]], [[UNIT:*]], [[NC.CONSTANT:*]],
                    [[STRUCTURE:*]], [[ALGORITHM:*]], [[PIPELINE:*]], [[ASPECT:*]], [[NODE:*]],
                    [[DM.ENTITY:*]], [[CONCERN:*]], [[DECISION:*]], [[TS.TIER:*.COMPONENT:*]],
                    [[CODE-PATTERN:*]], [[TEST-CASE:*]]"
                labeled: true
                qualified: true
                properties:
                    -   QUALITY
                config:
                    size-node-width-max: 440
            props:
                -   name: QUALITY
                    desc: >
                        The quality attribute the tactic addresses, a solution-oriented
                        refinement of the NON-FUNCTIONAL-REQUIREMENTS categories which intentionally
                        differs from them.

                        The NR categories follow the ISO/IEC 25010:2023 top-level characteristics
                        plus the non-quality categories `Compliance` and `Constraint`, whereas the
                        tactic qualities decompose some of the characteristics into the
                        finer-grained, architecturally actionable attributes `Scalability`,
                        `Availability`, `Privacy`, `Accessibility`, and `Portability` (with
                        `Flexibility` fully absorbed by `Scalability` and `Portability`), and
                        address a `Compliance` or `Constraint` requirement through the quality it
                        protects (e.g. a data protection obligation through `Privacy`). The
                        quality therefore need not match the category of the requirements it
                        addresses.
                    value: enum(Performance,Scalability,Reliability,Availability,Safety,Security,Privacy,Usability,Accessibility,Maintainability,Portability,Compatibility)
                -   name: ADDRESSES
                    desc: >
                        Comma-separated references to the NON-FUNCTIONAL-REQUIREMENTS objects the
                        tactic addresses.
                    value: list([[NR.*]])
                -   name: GUIDED-BY
                    desc: >
                        Comma-separated references to the ARCHITECTURE-TENETS objects the
                        mechanism of the tactic follows (e.g. the stateless replication following
                        a `Stateless Services` principle); omitted for a tactic following no
                        modeled tenet.
                    value: list([[MAXIM:*]], [[AT.PRINCIPLE:*]])
                    optional: true
                -   name: PATTERNS
                    desc: >
                        Comma-separated references to the ARCHITECTURE-PATTERNS objects the
                        mechanism of the tactic is built from (e.g. the failover built on a
                        `Circuit Breaker`), while `MECHANISM` states the mechanism itself; omitted
                        for a tactic built from no modeled pattern.
                    value: list([[PATTERN:*]])
                    optional: true
                -   name: MECHANISM
                    desc: >
                        The design mechanism through which the tactic is applied to achieve the
                        quality (e.g. `stateless replication behind a load balancer`,
                        `read-through cache`, `circuit breaker`).
                -   name: TRADES-OFF
                    desc: >
                        Comma-separated quality attributes (from the same set as `QUALITY`) the
                        tactic knowingly degrades in favor of the addressed one (e.g. a one-time
                        token trades `Usability` for `Security`); omitted when the tactic has no
                        notable cost on another quality.
                    value: tags(Performance,Scalability,Reliability,Availability,Safety,Security,Privacy,Usability,Accessibility,Maintainability,Portability,Compatibility)
                    optional: true
                -   name: AFFECTS
                    desc: >
                        Comma-separated references to the FUNCTIONALITY-VIEW, CONCURRENCY-VIEW,
                        NAMED-CONSTANTS, PROCESSING-VIEW, DEVELOPMENT-ASPECTS, DEPLOYMENT-VIEW,
                        DATA-MODEL, AUTHORIZATION-MODEL, or INTERFACE-MODEL objects the tactic
                        shapes (e.g. the components replicated, the timeout bounding a wait, the
                        cache and the algorithm speeding up a path, the aspects governing
                        modifiability, the entities anonymized, the roles and interfaces secured).
                    value: list([[FV.COMPONENT:*]], [[UNIT:*]], [[NC.CONSTANT:*]], [[STRUCTURE:*]],
                        [[ALGORITHM:*]], [[PIPELINE:*]], [[ASPECT:*]], [[DV.TIER:*]], [[AREA:*]],
                        [[NODE:*]], [[NETWORK:*]], [[DM.ENTITY:*]], [[ROLE:*]], [[INTERFACE:*]])
                    optional: true
                -   name: OPERATED-BY
                    desc: >
                        Comma-separated references to the OPERATIONS-VIEW objects whose procedure
                        acts upon the design mechanism of the tactic (e.g. the scaling out of the
                        replication, the restoring of the backup); omitted when no modeled procedure
                        operates the tactic.
                    value: list([[CONCERN:*]])
                    optional: true
                -   name: TOOLS
                    desc: >
                        Comma-separated references to the TECHNOLOGY-STACK components realizing the
                        tactic (e.g. the load balancer, the message broker, the CDN); omitted when
                        the tactic uses no modeled product.
                    value: list([[TS.TIER:*.COMPONENT:*]])
                    optional: true
-   kind: ARCH
    name: Design Decisions
    id: DD
    file: 32-ARCH-DD-Design-Decisions.md
    desc: >
        The major decisions related to the solution design, each recording the forces at play, the
        chosen response, and the reasoning that justifies it. The artifact is the last
        decision-level one of the architecture, as a decision references the requirements forcing
        it, the elements it shapes, and the tactics and products it chose, all of which precede
        it, while the Code Patterns following it reference the decisions they implement.
    optional: true
    refs: >
        -   Nygard: Documenting Architecture Decisions (2011),
            https://cognitect.com/blog/2011/11/15/documenting-architecture-decisions
        -   Tyree/Akerman: Architecture Decisions: Demystifying Architecture (2005),
            https://ieeexplore.ieee.org/document/1407822
        -   ADR: Architectural Decision Records (2017),
            https://adr.github.io/
    diagram:
        type: grid
        nodes: "[[DECISION:*]]"
        properties:
            -   STATUS
        config:
            size-node-width-max: 440
            grid-columns-max: 4
    children:
        -   kind: DECISION
            desc: |
                A single architecture decision, named with a short summary of the decision, not
                longer than 80 characters, and recorded entirely in its properties, with no
                description paragraph of its own: the forces driving it (`DRIVEN-BY`), the options
                it was chosen over (`ALTERNATIVES`), its context (`WHEN`), the decision itself
                (`WHAT`), its rationale (`WHY`), and its optional consequences (`CONSEQUENCES`) and
                background (`NOTES`).

                A decision *MUST* qualify on all of the following three tenets:
                -   **Hard to Reverse**: the cost of changing it later is meaningful ("Oh my god,
                    this would result in a dramatic refactoring!"). So, if a decision is easy to
                    reverse, just skip it.
                -   **Surprising without Context**: a future architect will look at the code and
                    wonder ("Why on earth did they do it this way?"). So, if a decision is not
                    surprising, nobody will wonder why.
                -   **Result of a Real Trade-Off**: there were genuine alternatives and one was
                    picked for specific reasons ("We deliberately chose this, because..."). So, if
                    there was no real alternative, there's nothing to record beyond "we did the
                    obvious thing."

                The following typically qualify as a decision:
                -   **Architectural shape.** "We're using a monorepo." "The write model is
                    event-sourced, the read model is projected into PostgreSQL."
                -   **Integration patterns between contexts.** "Ordering and Billing communicate
                    via domain events, not synchronous HTTP."
                -   **Technology choices that carry lock-in.** Database, message bus, auth
                    provider, deployment target. Not every library - just the ones that would take
                    a quarter to swap out.
                -   **Boundary and scope decisions.** "Customer data is owned by the Customer
                    context; other contexts reference it by ID only." The explicit no's are as
                    valuable as the yes's.
                -   **Deliberate deviations from the obvious path.** "We're using manual SQL
                    instead of an ORM because X." Anything where a reasonable reader would assume
                    the opposite. These stop the next engineer from "fixing" something that was
                    deliberate.
                -   **Rejected alternatives when the rejection is non-obvious.** If you considered
                    GraphQL and picked REST for subtle reasons, record it - otherwise someone will
                    suggest GraphQL again in six months.

                A constraint itself is not a decision: a compliance obligation, a hosting mandate,
                or a partner-imposed threshold is a Non-Functional Requirement (of category
                `Compliance`, `Constraint`, or the affected quality), and the decision is the
                response to it, referencing it through `DRIVEN-BY`. A standing rule is not a
                decision either: a maxim or principle reusable across many decisions is an
                Architecture Tenets object, and the decision applies it, referencing it through
                `GUIDED-BY`.

                `WHEN`, `WHAT`, and `WHY` are each just a single paragraph of concise and brief
                prose text, usually comprised of just 1 to 3 sentences. The value of a decision is
                in recording *that* a decision was made and *why* - not in filling out sections of
                a document.

                For the relationship between context, decision, and rationale, good checks are:
                the "litmus test" is that context = forces, decision = response to those forces,
                rationale = why the decision answers the forces in the context. The decision
                should feel like the natural, almost inevitable answer to the context - if a reader
                is surprised by the decision, either the context is missing a force, or the
                decision is under-justified. The rationale should make the decision feel earned,
                not asserted - if you delete the rationale and the decision suddenly looks
                arbitrary, the rationale was doing its job.
            optional: true
            mixins:
                -   EVIDENCE
            format:
                type: complex
            diagram:
                type: hub
                center: self
                nodes: "[[DECISION:*]], [[NR.REQUIREMENT:*]], [[PREMISE:*]], [[MAXIM:*]],
                    [[AT.PRINCIPLE:*]], [[PATTERN:*]], [[DM.ENTITY:*]], [[LIFECYCLE:*]], [[ROLE:*]],
                    [[INTERFACE:*]], [[TYPE:*]], [[ENDPOINT:*]], [[IC.PRINCIPLE:*]],
                    [[CONVENTION:*]], [[DIALOG-PATTERN:*]], [[STORYBOARD:*]], [[ELEMENT:*]],
                    [[CV.ENTITY:*]], [[FV.COMPONENT:*]], [[UNIT:*]], [[NC.CONSTANT:*]],
                    [[STRUCTURE:*]], [[ALGORITHM:*]], [[PIPELINE:*]], [[ASPECT:*]], [[DV.TIER:*]],
                    [[AREA:*]], [[NODE:*]], [[NETWORK:*]], [[TACTIC:*]],
                    [[TS.TIER:*.COMPONENT:*]], [[CODE-PATTERN:*]]"
                labeled: true
                qualified: true
                properties:
                    -   STATUS
                config:
                    size-node-width-max: 440
            props:
                -   name: STATUS
                    desc: |
                        The status of the decision, one of:
                        -   `Proposed`:   Under consideration, not yet binding.
                        -   `Accepted`:   Binding for the solution.
                        -   `Rejected`:   Considered and deliberately turned down, recorded so
                                          that it is not proposed again unknowingly.
                        -   `Deprecated`: No longer binding, without a replacing decision.
                        -   `Superseded`: Replaced by the decision referenced in `SUPERSEDED-BY`.
                    value: enum(Proposed,Accepted,Rejected,Deprecated,Superseded)
                -   name: SUPERSEDED-BY
                    desc: >
                        Reference to the DESIGN-DECISIONS object that supersedes this decision,
                        present if and only if `STATUS` is `Superseded` (which the schema cannot
                        enforce itself).
                    value: "[[DECISION:*]]"
                    optional: true
                    acyclic: true
                -   name: DRIVEN-BY
                    desc: >
                        Comma-separated references to the NON-FUNCTIONAL-REQUIREMENTS or
                        SOLUTION-PREMISES objects forcing the decision (e.g. the compliance
                        obligation, the budget constraint, the dependency taken as given), anchoring
                        the forces `WHEN` describes in prose: as a decision is the response to
                        forces, at least one is always named, usually a Non-Functional Requirement
                        and only exceptionally a premise alone, and a decision finding no
                        requirement to name reveals a missing one rather than a needless reference.
                    value: list([[NR.*]], [[PREMISE:*]])
                -   name: GUIDED-BY
                    desc: >
                        Comma-separated references to the ARCHITECTURE-TENETS objects the decision
                        applies (e.g. the `Buy before Build` maxim settling the choice of a managed
                        service, the `Async between Contexts` principle settling the integration
                        style), anchoring the principles the rationale `WHY` rests on; omitted for
                        a decision applying no modeled tenet.
                    value: list([[MAXIM:*]], [[AT.PRINCIPLE:*]])
                    optional: true
                -   name: AFFECTS
                    desc: >
                        Comma-separated references to the objects of the DATA, APIS, UXUI, or ARCH
                        artifacts the decision shapes, i.e. the entities, lifecycles, and roles, the
                        interfaces, datatypes, and endpoints, the interaction principles, language
                        conventions, dialog patterns, storyboards, and visual elements, and the
                        elements of the architecture views (e.g. the entity owned by a single
                        context, the interface styled REST instead of GraphQL, the dialog pattern
                        chosen over a native one, the components split, the external system
                        integrated, the algorithm chosen over a simpler one, the value fixed for a
                        constant); omitted for a decision shaping no modeled element.
                    value: list([[DM.ENTITY:*]], [[LIFECYCLE:*]], [[ROLE:*]], [[INTERFACE:*]],
                        [[TYPE:*]], [[ENDPOINT:*]], [[IC.PRINCIPLE:*]], [[CONVENTION:*]],
                        [[DIALOG-PATTERN:*]], [[STORYBOARD:*]], [[ELEMENT:*]], [[CV.ENTITY:*]],
                        [[FV.COMPONENT:*]], [[UNIT:*]], [[NC.CONSTANT:*]], [[STRUCTURE:*]],
                        [[ALGORITHM:*]], [[PIPELINE:*]], [[ASPECT:*]], [[DV.TIER:*]], [[AREA:*]],
                        [[NODE:*]], [[NETWORK:*]])
                    optional: true
                -   name: DECIDES
                    desc: >
                        Comma-separated references to the ARCHITECTURE-PATTERNS objects,
                        QUALITY-PERSPECTIVES tactics, or TECHNOLOGY-STACK components the decision
                        chose over their alternatives, i.e. the pattern, mechanism, or product
                        which exists because of this decision; omitted when the decision chose no
                        modeled pattern, tactic, or product.
                    value: list([[PATTERN:*]], [[TACTIC:*]], [[TS.TIER:*.COMPONENT:*]])
                    optional: true
                -   name: ALTERNATIVES
                    desc: >
                        Comma-separated names of the options considered but not chosen (e.g.
                        `REST polling, bespoke WebSocket protocol`): the rationale `WHY` states *why*
                        the decision won, this property states *against what*, and as a decision
                        qualifies only as the result of a real trade-off, there is always at least
                        one.
                -   name: WHEN
                    desc: |
                        The **Context** of the decision: it captures the situation that forces the
                        decision - the "why are we even talking about this" part. It describes the
                        situation as it is, before the decision is made. The following usually
                        goes into it:

                        -   the problem or need (what's broken, missing, or about to change that
                            requires a decision);
                        -   the forces at play (technical constraints, business requirements,
                            deadlines, team skills, existing systems, regulatory/compliance
                            pressures - often competing, and that tension is the whole point);
                        -   relevant facts (current architecture, prior decisions, assumptions,
                            what's known and what's uncertain); and
                        -   scope/boundaries (what this decision is and isn't about).

                        It is written neutrally and factually. It should not contain the decision
                        itself, nor advocate for an option - a reader should be able to read it,
                        pause, and arrive at the decision themselves because the forces make it
                        (nearly) inevitable.
                -   name: WHAT
                    desc: |
                        The **Decision** itself: it states what is actually going to be done - the
                        chosen response to the forces laid out in the context. It is written in
                        active, assertive voice, in the present or imperative tense, as a committed
                        position rather than a discussion. The following usually goes into it:

                        -   the choice itself (clearly and unambiguously); and
                        -   the essence of how (enough of the approach to make the choice concrete
                            - the mechanism, pattern, or technology - but not a full implementation
                            specification).

                        It is a declaration, not a deliberation, usually using the wording "We
                        use..." or "We do...", active, definite, owning the choice. Avoid hedging
                        ("we might", "we could consider") - the deliberation already happened, the
                        decision records the verdict.
                -   name: WHY
                    desc: |
                        The **Rationale** of the decision: it is the reasoning that justifies the
                        decision - the bridge that explains why this choice, given those forces. It
                        answers "Of all the things we could have done, why was this the right
                        one?" Where the context states the forces and the decision states the
                        choice, the rationale is the logical connective tissue between them - it
                        shows that the decision actually follows from the context. The following
                        usually goes into it:

                        -   the deciding factors (which forces from the context carried the most
                            weight, and how the chosen option satisfies them best);
                        -   the trade-off reasoning (what was optimized for and what was knowingly
                            sacrificed - naming the trade-off is the heart of the rationale);
                        -   why the alternatives lost (the comparative argument: "option B failed
                            on X, option C cost too much on Y"); and
                        -   assumptions and evidence (benchmarks, prior experience, constraints, or
                            principles the reasoning rests on).
                -   name: CONSEQUENCES
                    desc: |
                        The **Consequences** of the decision: what follows from it once made, in
                        contrast to the trade-off reasoning of `WHY`, which precedes it. It is
                        *OPTIONAL* and omitted when nothing non-obvious follows. The following
                        usually goes into it:

                        -   what becomes easier and what becomes harder (the negative consequences
                            are the valuable ones, as they are the price knowingly paid);
                        -   the obligations the decision imposes on the elements it affects (e.g.
                            a convention to follow, a migration to perform); and
                        -   the follow-up decisions it makes necessary.
                    optional: true
                -   name: NOTES
                    desc: |
                        The **Background** of the decision: it is *OPTIONAL* and can be omitted
                        when it does not add genuine value - most decisions won't need it. The
                        following usually goes into it:

                        -   information about the decision *process* (e.g. a weighted decision
                            matrix of considered alternatives); and
                        -   links to strongly related decisions.
                    optional: true

-   kind: ARCH
    name: Code Patterns
    id: CP
    file: 33-ARCH-CP-Code-Patterns.md
    desc: >
        The implementation patterns the source code of the solution follows, each prescribing how
        one recurring concern (e.g. authorization enforcement, entity persistence, error
        propagation) is coded and showing it as a code listing. The artifact follows the Design
        Decisions, as a pattern is the coded form of the tactics and decisions preceding it, and
        is absent when the coding conventions are governed outside the specification (e.g. by
        repository-level contributor instructions).
    optional: true
    refs: >
        -   Starke/Hruschka: arc42 Template: Crosscutting Concepts (2005),
            https://arc42.org/overview
        -   Fowler: Patterns of Enterprise Application Architecture (2002),
            https://martinfowler.com/books/eaa.html
        -   Beck: Implementation Patterns (2007),
            https://www.informit.com/store/implementation-patterns-9780321413093
    diagram:
        type: grid
        nodes: "[[CODE-PATTERN:*]]"
        config:
            size-node-width-max: 440
            grid-columns-max: 4
    children:
        -   kind: CODE-PATTERN
            desc: >
                A single code pattern, named with a short (2-5 word) summary of the concern it
                codes (e.g. `Endpoint Authorization`, `Entity Persistence`, `Error Propagation`)
                and described in a concise (1-3 sentence) paragraph by the rule the code follows
                whenever the concern arises, plus a 1-sentence rationale ("why") for the rule.

                The listing showing the pattern follows the description and its rationale as the
                elaboration of the pattern: either a fenced code block in the language of the
                pattern (e.g. ` ```ts start=10 mark=3-5 `, the parameters numbering the lines
                from `start` and marking the essential ones) or an embedded excerpt of an existing
                source file (e.g. `![Entity Persistence](src/persistence.ts#lines=10-30&mark=3-5)`,
                the fragment selecting and marking the lines), the latter preferred once the code
                exists, as the specification then never drifts from it. The listing is the
                canonical, idealized form of the pattern, not an exhaustive example, so it is kept
                short (typically 10-30 lines) and the prose names what the listing cannot: the
                places the pattern applies and the deviation it rules out (`AVOID`).

                A pattern states how a concern is coded, and nothing else: the structure or the
                quality mechanism it implements is an Architecture Patterns pattern or a Quality
                Perspectives tactic referenced through `REALIZES`, the
                trade-off that chose its approach over alternatives is a Design Decisions decision
                referenced through `DECIDED-BY` (a pattern weighs no alternatives itself), the
                product it codes against is a Technology Stack component referenced through
                `TOOLS`, and the rule about the source layout, build, or process it lives in is a
                Development Aspects aspect -- only the recurring code shape, the elements written
                that way, and the deviation ruled out belong here.
            optional: true
            format:
                type: complex
            diagram:
                type: hub
                center: self
                nodes: "[[CODE-PATTERN:*]], [[FV.COMPONENT:*]], [[UNIT:*]], [[STRUCTURE:*]],
                    [[ALGORITHM:*]], [[STAGE:*]], [[DM.ENTITY:*]], [[ROLE:*]], [[INTERFACE:*]],
                    [[ENDPOINT:*]], [[TS.TIER:*.COMPONENT:*]], [[PATTERN:*]], [[TACTIC:*]],
                    [[DECISION:*]]"
                labeled: true
                qualified: true
                config:
                    size-node-width-max: 440
            props:
                -   name: APPLIES-TO
                    desc: >
                        Comma-separated references to the FUNCTIONALITY-VIEW, CONCURRENCY-VIEW,
                        PROCESSING-VIEW, DATA-MODEL, AUTHORIZATION-MODEL, INTERFACE-MODEL, or
                        INTERFACE-ENDPOINTS objects whose code follows the pattern (e.g. the
                        components persisting their entities this way, the structures guarded by
                        the same locking shape, the roles and endpoints guarded by the check);
                        omitted for a pattern applied throughout the code base.
                    value: list([[FV.COMPONENT:*]], [[UNIT:*]], [[STRUCTURE:*]], [[ALGORITHM:*]],
                        [[STAGE:*]], [[DM.ENTITY:*]], [[ROLE:*]], [[INTERFACE:*]], [[ENDPOINT:*]])
                    optional: true
                -   name: REALIZES
                    desc: >
                        Comma-separated references to the ARCHITECTURE-PATTERNS objects or
                        QUALITY-PERSPECTIVES tactics the pattern is the coded form of (e.g. the
                        port interface coding the hexagonal architecture, the token check
                        implementing the access security tactic); omitted for a pattern serving
                        no modeled architecture pattern or tactic.
                    value: list([[PATTERN:*]], [[TACTIC:*]])
                    optional: true
                -   name: DECIDED-BY
                    desc: >
                        Comma-separated references to the DESIGN-DECISIONS objects the pattern
                        implements (e.g. the query builder usage following the decision against an
                        ORM); omitted for a pattern behind which no recorded decision stands.
                    value: list([[DECISION:*]])
                    optional: true
                -   name: TOOLS
                    desc: >
                        Comma-separated references to the TECHNOLOGY-STACK components the pattern
                        codes against (e.g. the query builder, the logging library); omitted for a
                        pattern using the language alone.
                    value: list([[TS.TIER:*.COMPONENT:*]])
                    optional: true
                -   name: USES
                    desc: >
                        Comma-separated references to the smaller CODE-PATTERNS objects the pattern
                        is composed of (e.g. an `Endpoint Authorization` using the `Error
                        Propagation` for its rejections), so that the patterns form a language of
                        related shapes rather than a flat catalogue.
                    value: list([[CODE-PATTERN:*]])
                    optional: true
                    acyclic: true
                -   name: AVOID
                    desc: >
                        The deviation the pattern rules out, stated as the concrete shape a
                        developer would otherwise reach for (e.g. `SQL strings assembled in the
                        request handlers`, `role checks in the client alone`); omitted when the
                        rule has no tempting alternative.
                    optional: true

-   kind: ARCH
    name: Code Map
    id: CM
    file: 37-ARCH-CM-Code-Map.md
    desc: >
        The mapping of the specification onto the source code or the shipped artifacts of the
        solution, each symbol of the code (a module, file, type, function, field, or resource)
        naming its location and the specification objects it implements, so that the
        specification and the code can be traced into each other in both directions. The artifact
        serves the forward-engineering (where has the specified element been implemented, what is
        still missing) as well as the reading of the code (which specified element does a
        generated or tersely named symbol realize), and is absent when the traceability is kept
        outside the specification.

        The artifact follows the Code Patterns, as a symbol may implement any object preceding it,
        and reports the share of the components, types, endpoints, constants, structures,
        algorithms, and stages implemented by at least one symbol. A symbol which is part of a
        third-party product is not mapped: the product is a Technology Stack component.
    optional: true
    coverage:
        -   "[[FV.COMPONENT:*]]"
        -   "[[TYPE:*]]"
        -   "[[ENDPOINT:*]]"
        -   "[[NC.CONSTANT:*]]"
        -   "[[STRUCTURE:*]]"
        -   "[[ALGORITHM:*]]"
        -   "[[STAGE:*]]"
    refs: >
        -   Clements et al.: Documenting Software Architectures: Views and Beyond, 2nd ed.: Implementation Style (2010),
            https://www.informit.com/store/documenting-software-architectures-views-and-beyond-9780321552686
        -   Gotel/Finkelstein: An Analysis of the Requirements Traceability Problem (1994),
            https://ieeexplore.ieee.org/document/292398
    diagram:
        type: grid
        nodes: "[[SYMBOL:*]]"
        nest:
            properties:
                -   PART-OF
            layout: grid
        properties:
            -   CLASS
        config:
            size-node-width-max: 440
            grid-columns-max: 4
    children:
        -   kind: SYMBOL
            desc: >
                A single symbol of the code, named with the name it is known by in the
                specification (usually its identifier in the code, or a meaningful name for a
                generated or tersely named one) and described by a 1-sentence description of
                its role ("what") plus a 1-sentence rationale ("why") for the mapping. A symbol
                is mapped only where the trace is worth keeping (e.g. the entry points of the
                components, the implementations of the algorithms and structures), not for every
                symbol of the code.
            optional: true
            mixins:
                -   EVIDENCE
            format:
                type: concise
                maxTableColumns: 5
            props:
                -   name: CLASS
                    desc: |
                        The class of the symbol, one of:
                        -   `Module`:   A package, namespace, library, or executable.
                        -   `File`:     A source or artifact file.
                        -   `Type`:     A class, structure, interface, or enumeration.
                        -   `Function`: A function, method, or procedure.
                        -   `Field`:    A variable, member, constant, or property.
                        -   `Resource`: An embedded or shipped resource (e.g. a table, a shader, a
                                        configuration file).
                    value: enum(Module,File,Type,Function,Field,Resource)
                -   name: IDENTIFIER
                    desc: >
                        The exact identifier of the symbol in the code, where it differs from
                        the name (e.g. a generated, mangled, or fully qualified identifier).
                    optional: true
                -   name: ALIAS
                    desc: >
                        Comma-separated further names of the symbol (e.g. its former name
                        before a rename, its exported or display name).
                    optional: true
                -   name: LOCATION
                    desc: >
                        Where the symbol resides (e.g. `src/net/codec.c:120-184`,
                        `build/libcore.so+0x4012a0`), relative to the root of the code base.
                    optional: true
                -   name: PART-OF
                    desc: >
                        Reference to the CODE-MAP symbol containing this one (e.g. the type a
                        method belongs to, the file a type resides in); omitted for a top-level
                        symbol.
                    value: "[[SYMBOL:*]]"
                    optional: true
                    acyclic: true
                -   name: IMPLEMENTS
                    desc: >
                        Comma-separated references to the specification objects the symbol
                        implements (e.g. a component, an endpoint, a type, a constant, an
                        algorithm, a test case), the core of the trace.
                    value: list([[*]])
                    optional: true
